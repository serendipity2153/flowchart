}
function runTest(){
  const vars=varsOf(); const inp={};
  for(const v of vars){ const el=$('#ti_'+v.key); let val=el.value; if(v.type==='bool') val=val==='true'; else if(v.type==='int'){ val=parseInt(val); if(isNaN(val)||val<v.min||val>v.max) return toast(`${v.name}要在 ${v.min}～${v.max} 之間`); } inp[v.key]=val; }
  const r=route({nodes:T.nodes,edges:T.edges},inp,vars);
  const log=$('#tlog'); const lines=[];
  r.steps.forEach(s=>lines.push(`「${esc(s.v.label)}」${esc(s.v.name)}＝${esc(valText(s.v,s.val))} → 走「${esc(condLabel(s.v,s.edge.cond))}」`));
  let end;
  if(!r.err) end=`<b style="color:var(--success-soft)">結果：${esc(r.out)}</b>`;
  else if(r.err==='noroot') end='<b style="color:var(--danger-soft)">還沒有根節點，沒辦法開始。</b>';
  else if(r.err==='novar') end='<b style="color:var(--danger-soft)">有一個決策節點還沒選問題。</b>';
  else if(r.err==='noout') end='<b style="color:var(--danger-soft)">走到一個還沒選結果的葉節點。</b>';
  else if(r.err==='stuck') end=`<b style="color:var(--danger-soft)">在「${esc(r.v?r.v.label:'')}」找不到符合 ${esc(r.v?r.v.name+'＝'+valText(r.v,r.val):'')} 的分支，卡住了。</b>`;
  else if(r.err==='overlap') end=`<b style="color:var(--danger-soft)">${esc(r.v.name)}＝${esc(valText(r.v,r.val))} 同時符合兩條分支，電腦不知道要走哪條。</b>`;
  else end='<b style="color:var(--danger-soft)">走不下去了。</b>';
  clearInterval(animT); let i=0; T.hl={nodes:new Set(),edges:new Set()}; log.innerHTML='';
  const reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
  const stepFn=()=>{
    if(i<r.path.length){ T.hl.nodes.add(r.path[i]); if(i>0) T.hl.edges.add(r.edges[i-1]); if(lines[i]) log.innerHTML+=`<div>${i+1}. ${lines[i]}</div>`; drawTree(); i++; }
    else { clearInterval(animT); log.innerHTML+=`<div>${end}</div>`; }
  };
  if(reduce){ while(i<=r.path.length) stepFn(); } else { stepFn(); animT=setInterval(stepFn,650); }
}

function check(){
  closeTPop(); const old=$('#ttest'); if(old) old.remove();

    <span>${q.level==='design'?`測試通過 ${res.passed}／${res.total} 筆`:`題目測試通過 ${res.passed}／${res.total} 種情況`}${res.ok&&!ds?'。你的樹在每一種情況都走到正確結果。':''}</span></div>

    ${ds?`<div class="small" style="display:grid;grid-template-columns:repeat(5,auto);gap:4px 14px;color:var(--text-2)"><span>結構 ${ds.sStruct}/30</span><span>條件 ${ds.sCond}/30</span><span>測試 ${ds.sTest}/25</span><span>說明 ${ds.sDesc}/15</span><b>總分 ${ds.total}</b></div><span class="small" style="color:var(--warning)">電腦只能檢查結構和你自己寫的測試；情境合不合理，要請老師看。</span>`:''}
    ${res.issues.length?`<ul style="margin:0;padding-left:20px;font-size:14px;line-height:1.7">${res.issues.slice(0,4).map(i=>`<li>${esc(i)}</li>`).join('')}</ul>`:''}
    ${res.counter?`<div style="font-size:14px;color:var(--danger-soft)">反例：${esc(res.counter)}</div>`:''}
    ${res.warn.length&&!res.ok?`<div class="small muted">${esc(res.warn[0])}</div>`:''}
    ${!res.ok?'<span class="small muted">紅色的節點和線是要檢查的地方。可以按「測試你的樹」自己試試看，或按左邊的「提示」。</span>':''}`;
  r.addEventListener('pointerdown',e=>e.stopPropagation());
  r.onclick=e=>{ const b=e.target.closest('[data-tr]'); if(!b) return; if(b.dataset.tr==='close'){ r.remove(); } if(b.dataset.tr==='next'){ start(TQ.indexOf(q)+1); } };

  if(ds) hint=`總分 ${ds.total}（需教師檢視）｜`+(d=>d.title)(T.design)+(hint?'｜'+hint:'');
  logResult({mode:'tree',qid:q.id,title:q.title,result:res.ok?(ds?'完成待檢視':'過關'):'未過',score:ds?`${ds.total}/100`:`${res.passed}/${res.total}`,attempt:att[q.id],hint});
}

function showRef(){
  const q=curQ();
  if(q.level==='design'){ openModal(`<div style="display:flex;justify-content:space-between;align-items:center"><h2>評量重點</h2><button class="ghost sm" data-close="1">關閉</button></div><p>${esc(q.focus)}</p><ul style="line-height:1.8"><li>至少 3 個判斷節點、4 個葉節點、2 層判斷</li><li>每條線都有清楚的條件，不重疊、不漏掉</li><li>至少 5 筆測試，其中 1 筆是邊界或特殊情況</li><li>設計說明至少 30 字</li></ul><p class="small muted">開放題沒有標準答案，情境合理性由老師檢視。</p>`); return; }
  const showIt=()=>{
    T.refSeen=true; saveT();
    const tr=treeFromRef(q.ref);
    const tests=TEACHER()?`<h3 style="margin:8px 0 0">測試案例（老師模式）</h3><table class="symtab"><tbody>${q.tests.map(t=>`<tr><td style="width:auto;text-align:left">${esc(describe(t,q.vars))}</td><td>→ ${esc(q.rule(t))}</td></tr>`).join('')}</tbody></table>`:'';
    openModal(`<div style="display:flex;justify-content:space-between;align-items:center"><h2>參考解法</h2><button class="ghost sm" data-close="1">關閉</button></div>
      <p class="small muted">這是其中一種正確畫法。判斷順序不同、分支畫法不同，只要每種情況結果都對，也算正確。</p>
      <div style="overflow:auto;background:var(--bg);border-radius:12px;padding:8px">${svgTree(tr,{vars:q.vars})}</div>${tests}`);
    $('#modalbox').style.width='min(980px,100%)';
  };
  if(TEACHER()||T.refSeen) return showIt();
  openModal(`<h2>確定要看參考解法嗎？</h2><p class="muted">建議先用完三個提示。看完之後，可以關掉自己再畫一次。</p><div class="actions"><button data-close="1">再想想</button><button class="primary" id="refgo">看參考解法</button></div>`);
  $('#refgo').onclick=showIt;

/* ---------- 迷宮（第 9 題） ---------- */
const MAZES=[
  {name:'迷宮 1',g:["#########","#S......#","#######.#","#.......#","#.#######","#......G#","#########"],dir:1},
  {name:'迷宮 2',g:["#########","#S.....G#","###.#####","###.#####","#########"],dir:1},
  {name:'迷宮 3',g:["#########","#..S....#","#.#####.#","#.#####.#","#.......#","####G####"],dir:1},
];
const DIRS=[[-1,0],[0,1],[1,0],[0,-1]]; const DIRZH=['北','東','南','西'];
let MZ=null, mzTimer=null;
function mzReset(i){
  clearInterval(mzTimer); mzTimer=null;
  const m=MAZES[i]; let s; m.g.forEach((row,r)=>{const c=row.indexOf('S'); if(c>=0) s=[r,c]});
  MZ={i,r:s[0],c:s[1],d:m.dir,steps:0,seen:new Set(),trail:[[s[0],s[1]]],status:'ready',msg:'按「走一步」或「連續走」開始。',obs:null,speed:MZ?MZ.speed:500};
}
function mzOpen(r,c){ const g=MAZES[MZ.i].g; return g[r]&&g[r][c]&&g[r][c]!=='#'; }
function mzObs(){ const L=(MZ.d+3)%4,R=(MZ.d+1)%4; const at=d=>mzOpen(MZ.r+DIRS[d][0],MZ.c+DIRS[d][1]); return {right:at(R),front:at(MZ.d),left:at(L)}; }
function mzStep(){
  if(!MZ||['goal','stop','loop','wall','err','limit'].includes(MZ.status)){ clearInterval(mzTimer); mzTimer=null; drawMaze(); return; }
  const g=MAZES[MZ.i].g;
  const key=MZ.r+','+MZ.c+','+MZ.d; if(MZ.seen.has(key)){ MZ.status='loop'; MZ.msg='陷入循環：機器人回到同一格、面向同一邊。這個規則在這個迷宮走不到終點（不代表你的樹錯了）。'; return mzEnd(); }
  MZ.seen.add(key);
  const inp=mzObs(); MZ.obs=inp; const vars=curQ().vars;
  const r=route({nodes:T.nodes,edges:T.edges},inp,vars);
  const sit=`右邊${inp.right?'能':'不能'}走、前方${inp.front?'能':'不能'}走、左邊${inp.left?'能':'不能'}走`;
  if(r.err){ MZ.status='err'; MZ.msg=`你的樹在「${sit}」這種情況沒有給出動作。先按「檢查答案」看看。`; return mzEnd(); }
  const act=r.out; T.hl={nodes:new Set(r.path),edges:new Set(r.edges)}; drawTree();
  if(act==='停止'){ MZ.status='stop'; MZ.msg=inp.right||inp.front||inp.left?`你的樹在「${sit}」選了停止，但其實有路可以走。`:'三個方向都不通，機器人照規則停下來了（這個規則不會往回走）。'; return mzEnd(); }
  let nd=MZ.d; if(act==='右轉前進') nd=(MZ.d+1)%4; else if(act==='左轉前進') nd=(MZ.d+3)%4; else if(act!=='前進'){ MZ.status='err'; MZ.msg=`「${act}」不是機器人看得懂的動作。`; return mzEnd(); }
  const nr=MZ.r+DIRS[nd][0], nc=MZ.c+DIRS[nd][1];
  if(!mzOpen(nr,nc)){ MZ.d=nd; MZ.status='wall'; MZ.msg=`碰壁了！在「${sit}」時你的樹選了「${act}」，但那邊不能走。`; return mzEnd(); }
  MZ.d=nd; MZ.r=nr; MZ.c=nc; MZ.steps++; MZ.trail.push([nr,nc]); MZ.status='run'; MZ.msg=`第 ${MZ.steps} 步：${sit} → ${act}`;
  if(g[nr][nc]==='G'){ MZ.status='goal'; MZ.msg=`到達終點！一共走了 ${MZ.steps} 步。`; return mzEnd(); }
  if(MZ.steps>=150){ MZ.status='limit'; MZ.msg='走了 150 步還沒到，先停下來。'; return mzEnd(); }
  drawMaze();
}
function mzEnd(){ clearInterval(mzTimer); mzTimer=null; drawMaze(); }
function drawMaze(){
  const p=$('#mazepanel'); if(!p) return; if(!MZ) mzReset(0);
  const m=MAZES[MZ.i]; const cs=36, H=m.g.length, W=m.g[0].length;
  let cells=''; m.g.forEach((row,r)=>[...row].forEach((ch,c)=>{ const x=c*cs,y=r*cs;
    cells+= ch==='#'?`<rect x="${x}" y="${y}" width="${cs}" height="${cs}" fill="#3D3833"/>`:`<rect x="${x}" y="${y}" width="${cs}" height="${cs}" fill="#1C1A17" stroke="#262320"/>`;
    if(ch==='G') cells+=`<rect x="${x+4}" y="${y+4}" width="${cs-8}" height="${cs-8}" rx="6" fill="#27342A" stroke="#9DBF9E" stroke-width="2"/><text x="${x+cs/2}" y="${y+cs/2}" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#B5D9B1">終點</text>`; }));
  const trail=MZ.trail.map(([r,c])=>`<circle cx="${c*cs+cs/2}" cy="${r*cs+cs/2}" r="4" fill="#E0B35C" opacity=".5"/>`).join('');
  const cx=MZ.c*cs+cs/2, cy=MZ.r*cs+cs/2; const ang=MZ.d*90;
  const robot=`<g transform="translate(${cx} ${cy}) rotate(${ang})"><circle r="13" fill="#232B36" stroke="#8FA9C9" stroke-width="2"/><polygon points="0,-11 7,4 -7,4" fill="#8FA9C9"/></g>`;
  const o=MZ.obs||mzObs();
  const col={goal:'var(--success-soft)',stop:'var(--warning)',loop:'var(--warning)',wall:'var(--danger-soft)',err:'var(--danger-soft)',limit:'var(--warning)'}[MZ.status]||'var(--text-2)';
  p.innerHTML=`<div style="display:flex;justify-content:space-between;align-items:center"><b>迷宮模擬</b><span class="small muted">每走一步，都用你的樹判斷一次</span></div>
    <div style="display:flex;gap:6px">${MAZES.map((z,i)=>`<button class="tab sm ${i===MZ.i?'on':''}" data-mz="${i}" style="${i===MZ.i?'background:var(--primary);color:var(--on-primary)':''}">${z.name}</button>`).join('')}</div>
    <div style="overflow:auto"><svg width="${W*cs}" height="${H*cs}" viewBox="0 0 ${W*cs} ${H*cs}" role="img" aria-label="迷宮，機器人在第 ${MZ.r} 列第 ${MZ.c} 行，面向${DIRZH[MZ.d]}">${cells}${trail}${robot}</svg></div>
    <div class="small" style="display:flex;gap:10px"><span>右：${o.right?'✓ 能走':'✕ 不能'}</span><span>前：${o.front?'✓ 能走':'✕ 不能'}</span><span>左：${o.left?'✓ 能走':'✕ 不能'}</span><span class="muted">面向${DIRZH[MZ.d]}</span></div>
    <div style="font-size:14px;line-height:1.6;color:${col}" aria-live="polite">${esc(MZ.msg)}</div>
    <div style="display:flex;gap:6px;flex-wrap:wrap"><button class="sm" data-mzc="step">走一步</button><button class="sm primary" data-mzc="run">${mzTimer?'暫停':'連續走'}</button><button class="sm" data-mzc="reset">重設</button></div>
    <label class="small" style="display:flex;gap:8px;align-items:center">速度<input type="range" id="mzspeed" min="100" max="1000" step="100" value="${1100-MZ.speed}" style="flex:1;min-height:0"></label>
    <p class="small faint" style="margin:0;line-height:1.6">「檢查答案」只看你的單步決策樹對不對。迷宮走不到終點，可能是這個簡單規則本身的限制。</p>`;
  p.onclick=e=>{ const z=e.target.closest('[data-mz]'); if(z){ mzReset(+z.dataset.mz); T.hl=null; drawTree(); drawMaze(); return; }
    const c=e.target.closest('[data-mzc]'); if(!c) return; const k=c.dataset.mzc;
    if(k==='step'){ if(mzTimer){clearInterval(mzTimer);mzTimer=null} if(['goal','stop','loop','wall','err','limit'].includes(MZ.status)) mzReset(MZ.i); mzStep(); }
    if(k==='run'){ if(mzTimer){ clearInterval(mzTimer); mzTimer=null; drawMaze(); return; } if(['goal','stop','loop','wall','err','limit'].includes(MZ.status)) mzReset(MZ.i); mzTimer=setInterval(mzStep,MZ.speed); drawMaze(); }
    if(k==='reset'){ mzReset(MZ.i); T.hl=null; drawTree(); drawMaze(); } };
  const sp=$('#mzspeed'); if(sp) sp.oninput=()=>{ MZ.speed=1100-(+sp.value); if(mzTimer){ clearInterval(mzTimer); mzTimer=setInterval(mzStep,MZ.speed); } };
}

/* ---------- 綁定 ---------- */
function bindPanel(){
  const p=$('#tpanel'); if(!p) return;
  p.onpointerdown=onPanelDown;
  p.onkeydown=e=>{ const it=e.target.closest('[data-titem]'); if(it&&(e.key==='Enter'||e.key===' ')){ e.preventDefault(); const n=addFromTray(it.dataset.titem); if(n) afterAdd(n); } };
  const ex=$('#texplain'); if(ex) ex.onchange=()=>{ T.explain=ex.value; saveT(); };
  p.querySelectorAll('[data-d]').forEach(el=>el.onchange=()=>onDesignChange(el));
}
function bind(){
  const app=$('#app');
  app.onclick=ev=>{
    const t=ev.target;
    if(t.closest('[data-go]')){ leave(()=>{S.screen='home';render()}); return; }
    const b=t.closest('[data-t]'); if(b){ act(b.dataset.t); return; }
    const dt=t.closest('[data-dtab]'); if(dt){ T.dtab=dt.dataset.dtab; redrawPanel(); return; }
    const dv=t.closest('[data-dv]'); if(dv){ onDesignBtn(dv.dataset.dv); return; }
    const sy=t.closest('[data-act="symbols"]'); if(sy){ showSymbols(); return; }
  };
  bindPanel();
  const cv=$('#tcv'); cv.onpointerdown=onCvDown;
  document.onpointermove=onMove; document.onpointerup=onUp;
  drawTree(); if(curQ().maze){ if(!MZ) mzReset(0); drawMaze(); }
}
function act(a){
  if(a==='undo') return undo(); if(a==='redo') return redo();
  if(a==='layout'){ if(!T.nodes.some(n=>n.kind==='root')) return toast('先放根節點才能整理'); snap(); layoutTree(T.nodes,T.edges); changed(); return; }
  if(a==='zoomin'){ T.scale=Math.min(1.6,+(T.scale+0.1).toFixed(1)); drawTree(); return; }
  if(a==='zoomout'){ T.scale=Math.max(0.5,+(T.scale-0.1).toFixed(1)); drawTree(); return; }
  if(a==='reset'){ openModal(`<h2>重新作答這一題？</h2><p class="muted">畫布上的東西會清掉，提示次數保留。其他題目不受影響。</p><div class="actions"><button data-close="1">取消</button><button class="primary" id="tresetgo">清掉重來</button></div>`); $('#tresetgo').onclick=()=>{ const q=curQ(); const keep={hints:T.hints,design:T.design,explain:T.explain}; snap(); const f=freshState(q); T.nodes=f.nodes; T.edges=f.edges; T.tray=f.tray; T.seq=f.seq; Object.assign(T,keep); T.result=null; saveT(); closeModal(); redrawPanel(); drawTree(); if(MZ){mzReset(MZ.i);drawMaze()} }; return; }
  if(a==='test') return testPanel();
  if(a==='check') return check();
  if(a==='hint'){ T.hints=Math.min(3,T.hints+1); saveT(); redrawPanel(); return; }
  if(a==='ref') return showRef();
  if(a==='cancellink'){ T.linkFrom=null; drawTree(); return; }
  if(a==='png') return exportPng(); if(a==='json') return exportJson();
}
function leave(cb){ clearInterval(mzTimer); mzTimer=null; clearInterval(animT); if(T) saveT(); cb(); }
function start(i){
  const q=TQ[i]; loadT(q); MZ=null; S.screen='tree'; S.mode='tree'; S.qi=i; S.qStart=Date.now(); render();
}
document.addEventListener('keydown',ev=>{

    const mv={ArrowLeft:[-10,0],ArrowRight:[10,0],ArrowUp:[0,-10],ArrowDown:[0,10]}[ev.key];
    if(mv){ ev.preventDefault(); n.x=Math.max(0,n.x+mv[0]); n.y=Math.max(0,n.y+mv[1]); saveT(); drawTree(); const el=document.querySelector(`.tn[data-nid="${n.id}"]`); if(el) el.focus(); return; } }
  if((ev.key==='Delete'||ev.key==='Backspace')&&T.selEdge){ snap(); T.edges=T.edges.filter(e=>e.id!==T.selEdge); T.selEdge=null; closeTPop(); changed(); }
});

window.TreeMode={TQ,homeList,view:()=>{ if(!T) loadT(TQ[S.qi]||TQ[0]); return view(); },bind,start,count:TQcount,
  _test:{grade,route,treeFromRef,get T(){return T},set T(v){T=v},loadT,mzReset,mzStep,get MZ(){return MZ},C}};
})();
