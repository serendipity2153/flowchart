<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>流程圖練習器</title>
<link href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@300;400;700&display=swap" rel="stylesheet">
<style>
:root{
  --primary:#C1B2A3;--primary-pressed:#AD9D8C;--on-primary:#1C1A17;--link:#D8CCBF;
  --bg:#1C1A17;--surface:#262320;--border:#3D3833;--border-strong:#57504A;
  --text:#F3EEE7;--text-2:#D9D0C5;--muted:#A89E92;--faint:#7A7066;
  --success:#8FBF8A;--success-soft:#B5D9B1;--warning:#E0B35C;--danger:#E07A6B;--danger-soft:#F0B3A9;--danger-bg:#3A2724;
  --terminal:#9DBF9E;--terminal-bg:#27342A;--io:#E0B35C;--io-bg:#3A3122;--process:#8FA9C9;--process-bg:#232B36;--decision:#C49AB8;--decision-bg:#332733;--decision-soft:#DCC0D3;--sub:#D4A08A;--sub-bg:#3A2C26;--sub-soft:#E8C4B4;
  --arrow:#A89E92;--radius:8px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--text);font-family:'LXGW WenKai TC',system-ui,-apple-system,'PingFang TC','Microsoft JhengHei',sans-serif;font-size:16px;line-height:1.6;overflow:hidden}
button{font-family:inherit;font-size:15px;cursor:pointer;border-radius:var(--radius);border:1px solid var(--border-strong);background:transparent;color:var(--text-2);padding:9px 16px;min-height:40px}
button:hover{border-color:var(--primary);color:var(--text)}
button.primary{background:var(--primary);color:var(--on-primary);border-color:var(--primary);font-weight:700;padding:10px 24px}
button.primary:hover{background:var(--primary-pressed)}
button:disabled{background:var(--border);color:var(--faint);border-color:var(--border);cursor:not-allowed}
button.ghost{border-color:transparent;color:var(--muted)}
button.ghost:hover{border-color:var(--border-strong)}
button.sm{padding:6px 12px;min-height:32px;font-size:13px}
input,select{font-family:inherit;font-size:15px;background:var(--bg);color:var(--text);border:1px solid var(--border-strong);border-radius:var(--radius);padding:8px 10px;min-height:40px}
input:focus,select:focus{outline:2px solid var(--primary);outline-offset:1px}
a{color:var(--link)}
#app{height:100%;display:flex;flex-direction:column}
.topbar{height:56px;flex:none;padding:0 20px 0 24px;background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:16px}
.topbar .left,.topbar .right{display:flex;align-items:center;gap:10px;min-width:0}
.topbar .right{flex-shrink:0}.topbar button{white-space:nowrap}
.logo{width:28px;height:28px;border-radius:8px;background:var(--primary);display:flex;align-items:center;justify-content:center;flex:none;border:0;padding:0;min-height:0}
.logo svg{display:block}
.brand{font-size:16px;font-weight:700;white-space:nowrap}
.sub{font-size:14px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.steps{display:flex;gap:6px}
.chip{font-size:13px;padding:3px 11px;border-radius:999px;border:1px solid var(--border);color:var(--muted);white-space:nowrap}
.chip.done{background:rgba(143,191,138,.18);color:var(--success-soft);border-color:transparent}
.chip.now{background:var(--primary);color:var(--on-primary);border-color:var(--primary);font-weight:700}
.chip.mode{background:rgba(157,191,158,.18);color:#B9D4B9;border-color:transparent}
.chip.bad{background:rgba(224,122,107,.18);color:var(--danger-soft);border-color:transparent}
.page{flex:1;overflow:auto;min-height:0}
.wrap{max-width:1120px;margin:0 auto;padding:32px 28px 48px;display:flex;flex-direction:column;gap:28px}
h1{margin:0;font-size:30px;font-weight:700;line-height:1.3}
h2{margin:0;font-size:20px;font-weight:700}
p{margin:0}
.muted{color:var(--muted)}
.faint{color:var(--faint)}
.small{font-size:13px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:20px 24px}
.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.modecard{text-align:left;padding:18px;min-height:128px;border-radius:14px;background:var(--surface);display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.modecard.sel{border:2px solid var(--primary)}
.modecard .ic{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center}
.modecard .t{font-size:17px;font-weight:700;color:var(--text)}
.modecard .d{font-size:13px;color:var(--muted);line-height:1.5}
.qcard{text-align:left;padding:14px 16px;min-height:88px;border-radius:12px;background:var(--surface);display:flex;flex-direction:column;justify-content:space-between;gap:8px;align-items:flex-start;color:var(--text)}
.qcard .t{font-size:16px}
.tag{font-size:12px;padding:1px 10px;border-radius:999px}
.tag.seq{background:rgba(143,169,201,.18);color:#AFC3DB}
.tag.dec{background:rgba(196,154,184,.18);color:var(--decision-soft)}
.tag.sub{background:rgba(212,160,138,.18);color:var(--sub-soft)}
.tag.ok{background:rgba(143,191,138,.18);color:var(--success-soft)}
.legend{display:flex;align-items:center;gap:22px;flex-wrap:wrap;padding:14px 20px}
.legend .it{display:flex;align-items:center;gap:10px;font-size:14px}
.sw{width:34px;height:18px;border:2px solid}
.sw.terminal{border-radius:999px;border-color:var(--terminal);background:var(--terminal-bg)}
.sw.io{border-color:var(--io);background:var(--io-bg);transform:skewX(-14deg)}
.sw.process{border-radius:4px;border-color:var(--process);background:var(--process-bg)}
.sw.decision{width:22px;height:22px;border-color:var(--decision);background:var(--decision-bg);transform:rotate(45deg) scale(.8);margin:0 6px}
.sw.subroutine{border-radius:3px;border-color:var(--sub);background:var(--sub-bg);border-left:6px double var(--sub);border-right:6px double var(--sub)}
.who{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.who input{width:110px}
.who input.name{width:150px}
.two{display:flex;flex-wrap:wrap;gap:28px;align-items:flex-start}
.two>.l{flex:1 1 300px;min-width:0;display:flex;flex-direction:column;gap:14px}
.two>.r{flex:999 1 520px;min-width:0;display:flex;flex-direction:column;gap:16px}
.story{font-size:18px;line-height:1.75}
.hintbox{background:rgba(193,178,163,.1);border:1px solid rgba(193,178,163,.4);border-radius:14px;padding:16px 20px;display:flex;flex-direction:column;gap:6px}
.q{display:flex;flex-direction:column;gap:12px}
.q.ok{border-color:var(--success)}
.q.bad{border-color:var(--danger)}
.q .head{display:flex;justify-content:space-between;align-items:center;gap:12px}
.q .head .t{font-size:17px;font-weight:700}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{padding:7px 14px;border-radius:999px;font-size:14px;min-height:36px}
.opt.sel{border:2px solid var(--primary);background:rgba(193,178,163,.2);color:var(--text)}
.opt.ok{border:2px solid var(--success);background:rgba(143,191,138,.18);color:var(--text)}
.opt.bad{border:2px solid var(--danger);background:rgba(224,122,107,.18);color:var(--text)}
.opt.big{border-radius:10px;padding:9px 22px;font-size:15px}
.fb{font-size:14px}
.fb.bad{color:var(--danger-soft)}
.fb.ok{color:var(--success-soft)}
.actions{display:flex;justify-content:flex-end;gap:12px;align-items:center;flex-wrap:wrap}
.pool{display:flex;flex-wrap:wrap;gap:10px;min-height:48px}
.scard{padding:9px 14px;border-radius:10px;background:var(--border);border:1px solid var(--border-strong);font-size:15px;cursor:grab;user-select:none;touch-action:none}
.scard.sel{outline:2px solid var(--primary);outline-offset:2px}
.scard.dragging{opacity:.4}
.cols{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px}
.col{border-radius:14px;border:2px dashed;padding:14px;min-height:260px;display:flex;flex-direction:column;gap:10px;cursor:pointer}
.col.over{background:rgba(255,255,255,.04)}
.col .h{display:flex;flex-direction:column;align-items:center;gap:6px;padding-bottom:10px;border-bottom:1px solid var(--border)}
.col .h .zh{font-size:15px;font-weight:700}
.col .h .en{font-size:12px;color:var(--muted)}
.col .hint{margin-top:auto;font-size:12px;color:var(--faint);text-align:center}
.col .hint.bad{color:var(--danger-soft)}
.col.terminal{border-color:rgba(157,191,158,.5);background:rgba(157,191,158,.05)}
.col.io{border-color:rgba(224,179,92,.5);background:rgba(224,179,92,.05)}
.col.process{border-color:rgba(143,169,201,.5);background:rgba(143,169,201,.05)}
.col.decision{border-color:rgba(196,154,184,.5);background:rgba(196,154,184,.05)}
.col.subroutine{border-color:rgba(212,160,138,.5);background:rgba(212,160,138,.05)}
.col.none{border-color:var(--border-strong);background:rgba(168,158,146,.04)}
.placed{font-size:14px;padding:8px 10px;text-align:center;border:2px solid;cursor:grab;user-select:none;touch-action:none}
.placed.terminal{border-radius:999px;border-color:var(--terminal);background:var(--terminal-bg)}
.placed.io{border-color:var(--io);background:var(--io-bg);transform:skewX(-10deg)}
.placed.io span{display:inline-block;transform:skewX(10deg)}
.placed.process{border-radius:8px;border-color:var(--process);background:var(--process-bg)}
.placed.decision{border-radius:8px;border-color:var(--decision);background:var(--decision-bg)}
.placed.subroutine{border-radius:4px;border-color:var(--sub);background:var(--sub-bg);border-left:7px double var(--sub);border-right:7px double var(--sub)}
.placed.none{border-radius:8px;border-color:var(--border-strong);background:var(--surface);color:var(--muted);text-decoration:line-through}
.placed.bad{border-color:var(--danger) !important;background:var(--danger-bg) !important}
.placed.ok{border-color:var(--success) !important}
.dragghost{position:fixed;pointer-events:none;z-index:50;opacity:.9}
/* canvas layout */
.work{flex:1;display:flex;min-height:0}
.tray{width:230px;flex:none;background:var(--surface);border-right:1px solid var(--border);padding:18px 14px;display:flex;flex-direction:column;gap:12px;overflow:auto}
.tray .h{display:flex;justify-content:space-between;align-items:center;font-size:14px;font-weight:700}
.tray .cnt{font-size:12px;color:var(--warning);font-weight:400}
.tnode{height:46px;display:flex;align-items:center;justify-content:center;font-size:14px;border:2px solid;cursor:grab;user-select:none;touch-action:none;padding:0 10px;text-align:center}
.tnode.terminal{border-radius:999px;border-color:var(--terminal);background:var(--terminal-bg)}
.tnode.io{border-color:var(--io);background:var(--io-bg);transform:skewX(-10deg)}
.tnode.io span{display:inline-block;transform:skewX(10deg)}
.tnode.process{border-radius:8px;border-color:var(--process);background:var(--process-bg)}
.tnode.decision{border-radius:8px;border-color:var(--decision);background:var(--decision-bg)}
.tnode.subroutine{border-radius:4px;border-color:var(--sub);background:var(--sub-bg);border-left:7px double var(--sub);border-right:7px double var(--sub)}
.tips{margin-top:auto;font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:6px;line-height:1.5}
.tips b{color:var(--text-2)}
.cv{flex:1;position:relative;min-width:0;background-color:var(--bg);background-image:radial-gradient(var(--border) 1px,transparent 1px);background-size:24px 24px;overflow:hidden}
.cv svg{width:100%;height:100%;display:block;touch-action:none}
.cv .empty{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);color:var(--faint);font-size:16px;pointer-events:none;text-align:center;line-height:1.7}
.pop{position:absolute;z-index:20;background:var(--surface);border:1px solid var(--process);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:10px;width:190px;box-shadow:0 8px 24px rgba(0,0,0,.4)}
.pop .row{display:flex;gap:8px}
.pop .row button{flex:1;font-weight:700}
.pop .y{border-color:var(--decision);color:var(--decision-soft)}
.pop input{width:100%}
.resbar{position:absolute;left:20px;right:20px;bottom:20px;z-index:15;background:var(--surface);border:1px solid var(--border-strong);border-radius:14px;padding:14px 18px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.resbar.bad{border-color:var(--danger)}
.resbar.ok{border-color:var(--success)}
.resbar .dot{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:700;flex:none}
.resbar.bad .dot{background:rgba(224,122,107,.2);color:var(--danger-soft)}
.resbar.ok .dot{background:rgba(143,191,138,.2);color:var(--success-soft)}
.resbar .msg{flex:1;min-width:220px;display:flex;flex-direction:column}
.resbar .msg b{font-size:16px}
.resbar .msg span{font-size:14px;color:var(--text-2)}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:var(--surface);border:1px solid var(--warning);color:var(--text);padding:12px 18px;border-radius:12px;font-size:15px;z-index:60;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw}
.toast.show{opacity:1}
.overlay{position:fixed;inset:0;background:rgba(28,26,23,.96);z-index:100;display:none;align-items:center;justify-content:center;padding:24px;text-align:center}
.overlay.show{display:flex}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:90;display:none;align-items:center;justify-content:center;padding:24px}
.modal.show{display:flex}
.modal .box{background:var(--surface);border:1px solid var(--border-strong);border-radius:16px;padding:24px 28px;width:min(640px,100%);max-height:90vh;overflow:auto;display:flex;flex-direction:column;gap:16px}
#tsvgwrap svg{width:auto!important;height:auto!important;max-width:none}
.tn:focus{outline:none}.tn:focus-visible>rect{stroke:#E0B35C!important;stroke-width:4}
.symtab{width:100%;border-collapse:separate;border-spacing:0 6px}
.symtab td{background:var(--bg);padding:8px 14px;vertical-align:middle;font-size:15px}
.symtab td:first-child{border-radius:10px 0 0 10px;width:110px;text-align:center}
.symtab td:last-child{border-radius:0 10px 10px 0}
.symtab .nm{font-weight:700;white-space:nowrap;width:110px}
.symtab .use{font-size:12px;padding:1px 8px;border-radius:999px;background:rgba(193,178,163,.2);color:var(--link);margin-left:6px;white-space:nowrap}
.symtab tr.extra td{opacity:.72}
.help{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.help .s{background:var(--bg);border:1px solid var(--border);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:6px;font-size:14px}
.help .s b{font-size:15px}
.help .n{width:26px;height:26px;border-radius:50%;background:var(--primary);color:var(--on-primary);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px}
.tracebox{position:relative;border-radius:10px;background-color:var(--bg);background-image:radial-gradient(var(--border) 1px,transparent 1px);background-size:24px 24px;overflow:auto;height:600px}
.tracebox svg{display:block}
.ans{display:flex;flex-direction:column;gap:10px}
.ans button{text-align:left;padding:12px 16px;border-radius:12px;font-size:16px;display:flex;align-items:center;gap:14px;background:var(--surface);color:var(--text)}
.ans button .k{width:28px;height:28px;border-radius:50%;border:1px solid var(--border-strong);display:flex;align-items:center;justify-content:center;font-size:13px;color:var(--muted);flex:none}
.ans button.sel{border:2px solid var(--primary);background:rgba(193,178,163,.18)}
.ans button.sel .k{background:var(--primary);color:var(--on-primary);border-color:var(--primary);font-weight:700}
.ans button.ok{border:2px solid var(--success)}
.ans button.bad{border:2px solid var(--danger)}
.celebrate{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:14}
.celebrate i{position:absolute;top:-12px;width:8px;height:14px;border-radius:2px;animation:fall 1.6s ease-in forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg);opacity:.2}}
.kv{display:grid;grid-template-columns:120px 1fr;gap:8px 12px;align-items:center;font-size:14px}
code{background:var(--bg);border:1px solid var(--border);border-radius:6px;padding:1px 6px;font-size:13px}
.status{font-size:13px;display:inline-flex;align-items:center;gap:6px}
.status i{width:8px;height:8px;border-radius:50%;display:inline-block;background:var(--faint)}
.status.on i{background:var(--success)}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast" class="toast"></div>
<div id="narrow" class="overlay"><div><h1 style="font-size:26px">請用電腦打開，並把視窗放大</h1><p class="muted" style="margin-top:10px">畫流程圖需要比較寬的畫面（至少 900 像素寬）。</p></div></div>
<div id="modal" class="modal"><div class="box" id="modalbox"></div></div>

<script>
/* ============ 老師設定區（可以直接改這裡） ============ */
const SHEET_URL_DEFAULT = "https://script.google.com/macros/s/AKfycbynvQvpxCZFPE7eB7UNeJKA-V93Rn-eUVv2ldOAiVE0QPLRRRNHV13ZNGutJNjtvoXWAw/exec";   // 貼上 Google Apps Script 網址，例如 "https://script.google.com/macros/s/xxxx/exec"
const TEACHER_PIN = "";         // 想鎖住「老師設定」就填 4 位數字，不填就不鎖
/* ====================================================== */

const BANK = JSON.parse(document.getElementById('bank').textContent);
const SYM = Object.fromEntries(BANK.symbols.map(s=>[s.type,s]));
const COLORS = {
  terminal:{stroke:'#9DBF9E',fill:'#27342A'}, io:{stroke:'#E0B35C',fill:'#3A3122'},
  process:{stroke:'#8FA9C9',fill:'#232B36'}, decision:{stroke:'#C49AB8',fill:'#332733'}, subroutine:{stroke:'#D4A08A',fill:'#3A2C26'},
};
const MODES = {
  draw:{name:'看題畫圖',desc:'讀題目，自己把流程圖畫出來',color:'process'},
  trace:{name:'看圖答結果',desc:'順著箭頭走，猜猜會發生什麼',color:'terminal'},
  sort:{name:'排序方塊',desc:'方塊都給你了，只要接對線',color:'io'},
  free:{name:'自由畫布',desc:'沒有題目，想畫什麼就畫什麼',color:'decision'},
  tree:{name:'決策樹',desc:'用條件分支做出判斷，10 題由淺到深',color:'subroutine'},
};
const $ = (s,el=document)=>el.querySelector(s);
const esc = s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const shuffle = a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const store = {
  get(k,d){try{const v=localStorage.getItem('fc_'+k);return v==null?d:JSON.parse(v)}catch(e){return d}},
  set(k,v){try{localStorage.setItem('fc_'+k,JSON.stringify(v))}catch(e){}}
};
let toastT; function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),2600)}

/* ---------- 文字寬度 ---------- */
const mctx = document.createElement('canvas').getContext('2d');
function textW(t,size=14){mctx.font=`${size}px 'LXGW WenKai TC', system-ui, sans-serif`;return mctx.measureText(t).width}
function nodeSize(sym,text){
  const w=textW(text);
  if(sym==='terminal') return {w:Math.max(140,w+48),h:48};
  if(sym==='io') return {w:Math.max(160,w+64),h:48};
  if(sym==='decision') return {w:Math.max(190,w+90),h:92};
  if(sym==='subroutine') return {w:Math.max(170,w+70),h:48};
  return {w:Math.max(160,w+44),h:48};
}

/* ---------- 全域狀態 ---------- */
const S = {
  screen:'home', mode:'draw', qi:0, step:1,
  who: store.get('who',{cls:'',seat:'',name:''}),
  sheetUrl: store.get('sheetUrl', SHEET_URL_DEFAULT),
  done: store.get('done',{}),            // 'draw:q1' -> true
  attempts:{}, qStart:0,
  s2:{start:null,end:null,has:null,which:null,checked:false},
  s3:{cards:[],sel:null,checked:false},
  cv:null, // 畫布狀態
};
const Q = ()=>BANK.questions[S.qi];

/* ---------- 路由與畫面 ---------- */
function render(){
  const app=$('#app');
  if(S.screen==='home') app.innerHTML=viewHome();
  else if(S.screen==='draw') app.innerHTML=viewDraw();
  else if(S.screen==='trace') app.innerHTML=viewTrace();
  else if(S.screen==='sort'||S.screen==='free') app.innerHTML=viewCanvasScreen();
  else if(S.screen==='tree'){ app.innerHTML=TreeMode.view(); TreeMode.bind(); return; }
  bind();
}
function topbar(mid,right){
  return `<div class="topbar">
    <div class="left">${S.screen!=='home'?'<button class="sm" data-go="home">← 回首頁</button>':''}<button class="logo" data-go="home" aria-label="回首頁"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="#1C1A17" stroke-width="1.8"><rect x="2" y="1.5" width="12" height="4" rx="2"/><path d="M8 5.5v3M3 12l5-3.5 5 3.5-5 3z"/></svg></button>${mid||'<span class="brand">流程圖練習器</span>'}</div>
    <div class="right">${right||''}</div></div>`;
}
function stepChips(cur){
  const names=['確定問題','問題分析','使用符號','繪製流程圖'];
  return `<div class="steps">${names.map((n,i)=>`<span class="chip ${i+1<cur?'done':i+1===cur?'now':''}">${i+1} ${n}${i+1<cur?' ✓':''}</span>`).join('')}</div>`;
}
function iconSvg(mode){
  const c=COLORS[MODES[mode].color].stroke;
  const p={draw:'<rect x="3" y="2" width="14" height="5" rx="2.5"/><path d="M10 7v3M4 15l6-4 6 4-6 3z"/>',
    trace:'<circle cx="10" cy="10" r="7"/><path d="M7 10l2 2 4-4"/>',
    sort:'<path d="M4 5h12M4 10h12M4 15h12M8 3l-2 2 2 2M12 13l2 2-2 2"/>',
    free:'<path d="M3 17l3-1 9-9-2-2-9 9zM12 4l2 2"/>',
    tree:'<circle cx="10" cy="4" r="2.5"/><circle cx="4" cy="16" r="2.5"/><circle cx="16" cy="16" r="2.5"/><path d="M10 6.5v3M10 9.5L4 13.5M10 9.5l6 4"/>'}[mode];
  return `<svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="${c}" stroke-width="1.8">${p}</svg>`;
}

/* ===================== 首頁 ===================== */
function viewHome(){
  const m=S.mode;
  const TYPE_ZH={sequence:'直敘',decision:'選擇',subroutine:'副程式'}; const TYPE_CLS={sequence:'seq',decision:'dec',subroutine:'sub'};
  const qlist = m==='free' ? '' : m==='tree' ? TreeMode.homeList() : `<div style="display:flex;flex-direction:column;gap:12px">
    <div style="display:flex;align-items:baseline;gap:12px"><h2>選一題</h2><span class="small muted">共 ${BANK.questions.length} 題，由簡單到難 · ${Object.keys(TYPE_ZH).map(t=>TYPE_ZH[t]+' '+BANK.questions.filter(q=>q.type===t).length+' 題').join('、')}</span></div>
    <div class="grid4">${BANK.questions.map((q,i)=>`<button class="qcard" data-q="${i}"><span class="t">${i+1} ${esc(q.title)}</span><span style="display:flex;gap:6px"><span class="tag ${TYPE_CLS[q.type]||'seq'}">${TYPE_ZH[q.type]||q.type}</span>${S.done[m+':'+q.id]?'<span class="tag ok">已過關</span>':''}</span></button>`).join('')}

/* ===================== 自動排版（看圖答結果用） ===================== */
function autoLayoutSvg(q){
  const nodes=q.nodes.map(n=>({...n,...nodeSize(n.symbol,n.text)}));
  const byId=Object.fromEntries(nodes.map(n=>[n.id,n]));
  const out={},inn={};
  q.edges.forEach(([a,b,l])=>{(out[a]=out[a]||[]).push({to:b,label:l});inn[b]=(inn[b]||0)+1});
  // 層級與分支
  const level={},branch={};
  const start=nodes[0].id; level[start]=0; branch[start]='M';
  const queue=[start];
  while(queue.length){const id=queue.shift();(out[id]||[]).forEach(e=>{
    const nl=level[id]+1; if(level[e.to]==null||nl>level[e.to]) level[e.to]=nl;
    let br=branch[id]; if(byId[id].symbol==='decision') br = e.label==='是'?'L':'R'; if((inn[e.to]||0)>=2) br='M';
    branch[e.to]=br; queue.push(e.to);});}
  const cx=300; const rowH=[]; nodes.forEach(n=>{rowH[level[n.id]]=Math.max(rowH[level[n.id]]||0,n.h)});
  let y=24; const rowY=[]; rowH.forEach((h,i)=>{rowY[i]=y;y+=h+44});
  nodes.forEach(n=>{const b=branch[n.id];const c = b==='L'?cx-200:b==='R'?cx+200:cx; n.x=c-n.w/2; n.y=rowY[level[n.id]]+(rowH[level[n.id]]-n.h)/2;});
  const edges=q.edges.map(([a,b,l])=>({from:a,to:b,label:l}));
  const H=y+8;
  return `<svg xmlns="http://www.w3.org/2000/svg" width="600" height="${H}" viewBox="0 0 600 ${H}" style="font-family:'LXGW WenKai TC',system-ui,sans-serif">${svgDefs()}${edges.map(e=>edgeSvg(e,byId,null,false)).join('')}${nodes.map(n=>nodeSvg(n,null,false)).join('')}</svg>`;
}

/* ===================== SVG 繪圖 ===================== */
function svgDefs(){return `<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9z" fill="context-stroke"/></marker></defs>`}
function shapePath(n){
  const {x,y,w,h}=n;
  if(n.symbol==='terminal') return `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${h/2}"/>`;
  if(n.symbol==='process') return `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="8"/>`;
  if(n.symbol==='io'){const k=14;return `<polygon points="${x+k},${y} ${x+w},${y} ${x+w-k},${y+h} ${x},${y+h}"/>`}
  if(n.symbol==='subroutine') return `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="4"/><line x1="${x+9}" y1="${y}" x2="${x+9}" y2="${y+h}"/><line x1="${x+w-9}" y1="${y}" x2="${x+w-9}" y2="${y+h}"/>`;
  return `<polygon points="${x+w/2},${y} ${x+w},${y+h/2} ${x+w/2},${y+h} ${x},${y+h/2}"/>`;
}
function nodeSvg(n,mark,interactive){
  const c=COLORS[n.symbol]; const stroke = mark==='ok'?'#8FBF8A':mark==='bad'?'#E07A6B':c.stroke; const fill = mark==='bad'?'#3A2724':c.fill;
  const ports = interactive ? [['t',n.x+n.w/2,n.y],['b',n.x+n.w/2,n.y+n.h],['l',n.x,n.y+n.h/2],['r',n.x+n.w,n.y+n.h/2]].map(([p,px,py])=>`<circle class="port" data-port="${p}" cx="${px}" cy="${py}" r="7" fill="#1C1A17" stroke="#C1B2A3" stroke-width="2" style="cursor:crosshair"/>`).join('') : '';
  const sel = n.selected?`<rect x="${n.x-6}" y="${n.y-6}" width="${n.w+12}" height="${n.h+12}" rx="10" fill="none" stroke="#C1B2A3" stroke-width="1.5" stroke-dasharray="4 3"/>`:'';
  return `<g class="node" data-id="${n.id}" style="${interactive?'cursor:grab':''}">${sel}<g fill="${fill}" stroke="${stroke}" stroke-width="2">${shapePath(n)}</g><text x="${n.x+n.w/2}" y="${n.y+n.h/2}" text-anchor="middle" dominant-baseline="central" font-size="14" fill="#F3EEE7" style="pointer-events:none;user-select:none">${esc(n.text)}</text>${ports}</g>`;
}
function portPos(n,p){return p==='t'?[n.x+n.w/2,n.y]:p==='b'?[n.x+n.w/2,n.y+n.h]:p==='l'?[n.x,n.y+n.h/2]:[n.x+n.w,n.y+n.h/2]}
function routeEdge(a,b){
  const ac=[a.x+a.w/2,a.y+a.h/2], bc=[b.x+b.w/2,b.y+b.h/2];
  let pts=[];
  if(b.y >= a.y+a.h+16){ // 往下
    const dx=bc[0]-ac[0];
    if(a.symbol==='decision' && Math.abs(dx)>60){
      const p0=portPos(a,dx<0?'l':'r'); pts=[p0,[bc[0],p0[1]],[bc[0],b.y]];
    } else {
      const p0=portPos(a,'b');
      if(Math.abs(dx)<2) pts=[p0,[p0[0],b.y]];
      else {const my=(a.y+a.h+b.y)/2; pts=[p0,[p0[0],my],[bc[0],my],[bc[0],b.y]];}
    }
  } else if(a.y >= b.y+b.h+16){ // 往上（回頭）
    const right = bc[0]>=ac[0];
    const p0=portPos(a,right?'r':'l'); const p1=portPos(b,right?'l':'r');
    if((right && b.x > a.x+a.w+40) || (!right && b.x+b.w < a.x-40)){
      const mx=(p0[0]+p1[0])/2; pts=[p0,[mx,p0[1]],[mx,p1[1]],p1];
    } else {
      const off = right? Math.max(a.x+a.w,b.x+b.w)+40 : Math.min(a.x,b.x)-40;
      const p1b=portPos(b,right?'r':'l'); pts=[p0,[off,p0[1]],[off,p1b[1]],p1b];
    }
  } else { // 同一層左右
    const right = bc[0]>=ac[0];
    const p0=portPos(a,right?'r':'l'), p1=portPos(b,right?'l':'r');
    const mx=(p0[0]+p1[0])/2; pts = Math.abs(p0[1]-p1[1])<2 ? [p0,p1] : [p0,[mx,p0[1]],[mx,p1[1]],p1];
  }
  return pts;
}
function edgeSvg(e,byId,mark,interactive){
  const a=byId[e.from], b=byId[e.to]; if(!a||!b) return '';
  const pts=routeEdge(a,b);
  const d='M'+pts.map(p=>p.join(' ')).join(' L');
  const col = mark==='ok'?'#8FBF8A':mark==='bad'?'#E07A6B':e.active?'#8FA9C9':'#A89E92';
  let label='';
  if(e.label){
    const p0=pts[0],p1=pts[1]; let lx,ly;
    if(p0[1]===p1[1]){lx=p0[0]+(p1[0]>p0[0]?26:-26);ly=p0[1]-16}else{lx=p0[0]+22;ly=p0[1]+18}
    label=`<g style="pointer-events:none"><rect x="${lx-14}" y="${ly-11}" width="28" height="22" rx="11" fill="#262320" stroke="#C49AB8" stroke-width="1"/><text x="${lx}" y="${ly}" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="700" fill="#DCC0D3">${e.label}</text></g>`;
  }
  const hit = interactive?`<path d="${d}" fill="none" stroke="transparent" stroke-width="16" style="cursor:pointer"/>`:'';
  const sel = e.selected?`<path d="${d}" fill="none" stroke="#C1B2A3" stroke-width="8" opacity=".35"/>`:'';
  return `<g class="edge" data-eid="${e.id||''}">${sel}<path d="${d}" fill="none" stroke="${col}" stroke-width="2" marker-end="url(#arr)"/>${hit}${label}</g>`;
}

/* ===================== 畫布引擎 ===================== */
function newCanvas(opts){
  S.cv={nodes:[],edges:[],tray:[],undo:[],selEdge:null,selNode:null,seq:1,graded:null,free:!!opts.free,...opts};
}
function cvSnapshot(){const c=S.cv;c.undo.push(JSON.stringify({nodes:c.nodes,edges:c.edges,tray:c.tray}));if(c.undo.length>40)c.undo.shift()}
function cvUndo(){const c=S.cv;const s=c.undo.pop();if(!s)return toast('沒有可以復原的了');const o=JSON.parse(s);c.nodes=o.nodes;c.edges=o.edges;c.tray=o.tray;c.graded=null;hideRes();drawCanvas()}
function drawCanvas(){
  const c=S.cv; const svg=$('#svg'); if(!svg) return;
  const byId=Object.fromEntries(c.nodes.map(n=>[n.id,n]));
  const g=c.graded;
  const em = g ? (id)=>g.edgeMark[id] : ()=>null;
  const nm = g ? (id)=>g.nodeMark[id] : ()=>null;

    const [px,py]=svgPoint(ev); n.x=px-n.w/2; n.y=py-n.h/2; c.nodes.push(n);

  const node=ev.target.closest('.node');
  if(node){ev.preventDefault();closePop();const n=c.nodes.find(x=>x.id===node.dataset.id);const [px,py]=svgPoint(ev);
    const now=Date.now(); if(lastTap.id===n.id&&now-lastTap.t<400){lastTap={};drag=null;return nodeAction(n,px,py,'dbl')} lastTap={id:n.id,t:now};
    drag={type:'node',id:n.id,dx:px-n.x,dy:py-n.y,moved:false,px,py};c.selNode=n.id;c.selEdge=null;drawCanvas();return}
  const edge=ev.target.closest('.edge');

        } else {

/* ===================== 批改 ===================== */
function grade(){
  const c=S.cv, q=Q();
  if(c.tray.length) return toast(`還有 ${c.tray.length} 個方塊沒放上去`);
  if(!c.edges.length) return toast('先從「開始」拉一條線出來');
  const exp = q.edges.map(([a,b,l])=>({from:a,to:b,label:l||null}));
  const key=e=>e.from+'>'+e.to;
  const expMap=Object.fromEntries(exp.map(e=>[key(e),e]));
  // 同名同符號的方塊（例如兩個「算面積」）可以互換：找出讓對的線最多的對應方式
  const groups={}; q.nodes.forEach(n=>{(groups[n.symbol+'|'+n.text]=groups[n.symbol+'|'+n.text]||[]).push(n.id)});
  const dup=Object.values(groups).filter(g=>g.length>1);
  const perms=a=>a.length<=1?[a]:a.flatMap((x,i)=>perms(a.slice(0,i).concat(a.slice(i+1))).map(p=>[x,...p]));
  let maps=[{}];
  dup.forEach(g=>{const nm=[];perms(g).forEach(p=>{maps.forEach(m=>{const m2={...m};g.forEach((id,i)=>m2[id]=p[i]);nm.push(m2)})});maps=nm});
  let best=null,bestScore=-1;
  maps.forEach(m=>{const sc=c.edges.filter(e=>{const x=expMap[(m[e.from]||e.from)+'>'+(m[e.to]||e.to)];return x&&(x.label||null)===(e.label||null)}).length; if(sc>bestScore){bestScore=sc;best=m}});
  const M=best||{}; const R={}; Object.entries(M).forEach(([a,b])=>R[b]=a);
  const sEdges=c.edges.map(e=>({...e,from:M[e.from]||e.from,to:M[e.to]||e.to}));
  const edgeMark={}, nodeMarkC={}; let correct=0;
  sEdges.forEach(e=>{const x=expMap[key(e)]; const ok = x && (x.label||null)===(e.label||null); edgeMark[e.id]=ok?'ok':'bad'; if(ok)correct++;});
  const byId=Object.fromEntries(q.nodes.map(n=>[n.id,n]));
  const problems=[]; // 依題目順序找第一個問題
  q.nodes.forEach(n=>{
    const outExp=exp.filter(e=>e.from===n.id), outStu=sEdges.filter(e=>e.from===n.id);
    const inStu=sEdges.filter(e=>e.to===n.id);
    let bad=false, msg=null;
    if(n.symbol!=='terminal'||n.id===q.nodes[0].id){
      if(outExp.length && !outStu.length){bad=true; msg = n.id===q.nodes[0].id?'先從「開始」拉一條線出來。':n.symbol==='decision'?'判斷一定要有「是」和「否」兩條路。':`「${n.text}」之後，下一步是什麼？`}
    }
    if(!bad && n.symbol==='decision' && outStu.length<2){bad=true;msg='判斷一定要有「是」和「否」兩條路。'}
    if(!bad){
      const wrong=outStu.find(e=>!expMap[key(e)]);
      if(wrong){bad=true;msg=`「${n.text}」不應該接到「${byId[wrong.to].text}」。再讀一次題目。`}
    }
    if(!bad){
      const lab=outStu.find(e=>expMap[key(e)]&&(expMap[key(e)].label||null)!==(e.label||null));
      if(lab){bad=true;msg='「是」和「否」接反了嗎？再想想哪一邊才對。'}
    }
    if(!bad && n.id!==q.nodes[0].id && !inStu.length){bad=true;msg=`「${n.text}」沒有人接到它。`}
    nodeMarkC[n.id]=bad?'bad':'ok'; if(bad&&msg) problems.push(msg);
  });
  const nodeMark={}; c.nodes.forEach(n=>{nodeMark[n.id]=nodeMarkC[M[n.id]||n.id]});
  // 版面提醒：由上而下、由左至右
  const pos=Object.fromEntries(c.nodes.map(n=>[n.id,n]));
  const upward=c.edges.some(e=>{const a=pos[e.from],b=pos[e.to];return a&&b&&(b.y+b.h/2)<(a.y+a.h/2)-10});
  const allOk = problems.length===0 && correct===exp.length && c.edges.length===exp.length;
  c.graded={edgeMark,nodeMark,allOk,correct,total:exp.length};
  drawCanvas();
  const mode = S.screen==='draw'?'draw':'sort';
  S.attempts[mode+':'+q.id]=(S.attempts[mode+':'+q.id]||0)+1;
  showRes(allOk, allOk?(upward?'全部接對了！':'太棒了，全部正確！'):'差一點！', allOk?(upward?'不過流程圖習慣「由上而下、由左至右」，有幾條線往上走，試著把後面的方塊往下移。':`${exp.length} 條線都接對了。把圖存下來吧。`):problems[0], correct, exp.length);
  if(allOk){S.done[mode+':'+q.id]=true;store.set('done',S.done);celebrate()}
  logResult({mode, qid:q.id, title:q.title, result:allOk?'過關':'未過', score:`${correct}/${exp.length}`, attempt:S.attempts[mode+':'+q.id], hint:allOk?'':problems[0]});
}
function showRes(ok,title,msg,correct,total){
  hideRes(); const cv=$('#cv'); const r=document.createElement('div'); r.className='resbar '+(ok?'ok':'bad'); r.id='resbar';
  r.innerHTML=`<span class="dot">${ok?'✓':'!'}</span><div class="msg"><b>${title}</b><span>${esc(msg||'')}</span></div><span class="small muted">${correct} ／ ${total} 條線正確</span>
    ${ok?`<button data-cv="png">下載圖片</button><button class="primary" data-act="nextq">下一題</button>`:`<button class="primary" data-cv="fix">回去修改</button>`}`;
  r.addEventListener('pointerdown',e=>e.stopPropagation());
  cv.appendChild(r);
}
function celebrate(){
  const cv=$('#cv'); const d=document.createElement('div'); d.className='celebrate'; d.id='celebrate';
  const cols=['#9DBF9E','#E0B35C','#8FA9C9','#C49AB8','#C1B2A3'];

/* ===================== 下載 PNG ===================== */
function downloadPng(send){
  const c=S.cv; if(!c.nodes.length) return toast('畫布是空的');
  const pad=40; const minX=Math.min(...c.nodes.map(n=>n.x))-pad, minY=Math.min(...c.nodes.map(n=>n.y))-pad;
  const maxX=Math.max(...c.nodes.map(n=>n.x+n.w))+pad+60, maxY=Math.max(...c.nodes.map(n=>n.y+n.h))+pad;
  const W=Math.max(400,maxX-minX), H=Math.max(300,maxY-minY)+40;
  const byId=Object.fromEntries(c.nodes.map(n=>[n.id,n]));
  const title = S.screen==='free' ? '我的流程圖' : `第 ${S.qi+1} 題 ${Q().title}`;
  const who = [S.who.cls,S.who.seat,S.who.name].filter(Boolean).join(' ');
  const g=c.graded;
  const inner = svgDefs()+`<rect width="${W}" height="${H}" fill="#1C1A17"/><g transform="translate(${-minX},${-minY})">${c.edges.map(e=>edgeSvg({...e,selected:false},byId,g?g.edgeMark[e.id]:null,false)).join('')}${c.nodes.map(n=>nodeSvg({...n,selected:false},g?g.nodeMark[n.id]:null,false)).join('')}</g><text x="16" y="${H-16}" font-size="13" fill="#A89E92">${esc(title)}${who?' · '+esc(who):''} · 流程圖練習器</text>`;
  const svgStr=`<svg xmlns="http://www.w3.org/2000/svg" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" style="font-family:'LXGW WenKai TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif">${inner}</svg>`;
  const img=new Image(); const url=URL.createObjectURL(new Blob([svgStr],{type:'image/svg+xml;charset=utf-8'}));
  img.onload=()=>{const cv=document.createElement('canvas');cv.width=W*2;cv.height=H*2;const ctx=cv.getContext('2d');ctx.scale(2,2);ctx.drawImage(img,0,0);URL.revokeObjectURL(url);
    if(send){ return send(cv.toDataURL('image/png'), title); }
    cv.toBlob(b=>{const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=(title+(who?'-'+who:'')).replace(/\s+/g,'_')+'.png';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000);toast('圖片已下載')},'image/png')};
  img.onerror=()=>toast('下載失敗，請改用螢幕截圖');
  img.src=url;
}

/* ===================== Google 試算表 ===================== */
function logResult(d){
  if(!S.sheetUrl) return;
  const row={t:new Date().toISOString(),cls:S.who.cls,seat:S.who.seat,name:S.who.name,
    seconds:Math.round((Date.now()-S.qStart)/1000),...d};
  const queue=store.get('queue',[]); queue.push(row); store.set('queue',queue); flushQueue();
}
async function flushQueue(){
  if(!S.sheetUrl) return; let queue=store.get('queue',[]); if(!queue.length) return;
  const sending=queue.slice(); store.set('queue',[]);
  try{ await fetch(S.sheetUrl,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({rows:sending})}); }
  catch(e){ store.set('queue',sending.concat(store.get('queue',[]))); }
}
function needWho(){
  if(!S.sheetUrl) return false;
  return !(S.who.cls&&S.who.seat&&S.who.name);
}

function symIcon(t){
  const st='stroke-width="2" stroke-linejoin="round"';
  const c={terminal:['#9DBF9E','#27342A'],io:['#E0B35C','#3A3122'],process:['#8FA9C9','#232B36'],decision:['#C49AB8','#332733'],subroutine:['#D4A08A','#3A2C26']}[t]||['#A89E92','#2E2A26'];
  const f=`fill="${c[1]}" stroke="${c[0]}" ${st}`;
  const shapes={
    terminal:`<rect x="8" y="6" width="64" height="28" rx="14" ${f}/>`,
    io:`<polygon points="18,6 74,6 62,34 6,34" ${f}/>`,
    process:`<rect x="8" y="6" width="64" height="28" rx="3" ${f}/>`,
    decision:`<polygon points="40,3 74,20 40,37 6,20" ${f}/>`,
    loop:`<polygon points="20,6 60,6 72,20 60,34 20,34 8,20" ${f}/>`,
    arrow:`<line x1="8" y1="20" x2="66" y2="20" stroke="${c[0]}" stroke-width="2.5"/><polygon points="64,14 74,20 64,26" fill="${c[0]}"/>`,
    comment:`<line x1="4" y1="20" x2="30" y2="20" stroke="${c[0]}" stroke-width="2" stroke-dasharray="4 3"/><rect x="30" y="6" width="44" height="28" fill="${c[1]}" stroke="${c[0]}" stroke-width="2" stroke-dasharray="4 3"/>`,
    subroutine:`<rect x="8" y="6" width="64" height="28" rx="2" ${f}/><line x1="16" y1="6" x2="16" y2="34" stroke="${c[0]}" stroke-width="2"/><line x1="64" y1="6" x2="64" y2="34" stroke="${c[0]}" stroke-width="2"/>`,
    document:`<path d="M8 6 H72 V30 C58 22 46 40 30 32 C22 28 14 30 8 33 Z" ${f}/>`,
  };
  return `<svg width="80" height="40" viewBox="0 0 80 40" aria-hidden="true">${shapes[t]}</svg>`;
}
function showSymbols(){
  openModal(`<div style="display:flex;justify-content:space-between;align-items:center"><h2>流程圖符號說明</h2><button class="ghost sm" data-close="1">關閉</button></div>
  <p class="small muted">標「這裡會用到」的是練習時要用的符號；其他的先認識就好。</p>
  <table class="symtab"><tbody>${SYMBOL_TABLE.map(([t,n,d,u])=>`<tr class="${u?'':'extra'}"><td>${symIcon(t)}</td><td class="nm">${n}${u?'<br><span class="use">這裡會用到</span>':''}</td><td>${d}</td></tr>`).join('')}</tbody></table>`);
  $('#modalbox').style.width='min(720px,100%)';
}
function showSettings(){
  if(TEACHER_PIN){const p=prompt('請輸入老師密碼');if(p!==TEACHER_PIN)return toast('密碼不對')}
  const q=store.get('queue',[]);
  openModal(`<div style="display:flex;justify-content:space-between;align-items:center"><h2>老師設定</h2><button class="ghost sm" data-close="1">關閉</button></div>
  <p class="small muted">學生每按一次「批改」或「檢查」，結果就會送到你的 Google 試算表。設定方法請看資料夾裡的 <code>05-Google試算表設定.md</code>。要看全班進度，打開 <a href="teacher.html" target="_blank">老師看板</a>。</p>
  <div class="kv"><label for="su">試算表網址</label><input id="su" placeholder="https://script.google.com/macros/s/…/exec" value="${esc(S.sheetUrl||'')}">
  <span class="small muted">狀態</span><span class="small">${S.sheetUrl?'已設定':'尚未設定'}${q.length?`，還有 ${q.length} 筆紀錄等著送出`:''}</span></div>
  <div class="actions" style="justify-content:space-between"><button class="sm" data-testsheet="1">測試連線</button><div style="display:flex;gap:8px"><button class="sm" data-resetdone="1">清除這台電腦的過關紀錄</button><button class="primary" data-savesheet="1">儲存</button></div></div>`);
}

/* ===================== 事件綁定 ===================== */
function startQuestion(mode,qi){
  if(needWho()) return toast('先在上面填班級、座號、姓名，老師才看得到你的作答');
  if(mode==='tree') return TreeMode.start(qi);
  S.qi=qi; S.qStart=Date.now(); S.mode=mode;
  if(mode==='draw'){S.screen='draw';S.step=1;S.s2={start:null,end:null,has:null,which:null,checked:false};render();startCountdown();}
  else if(mode==='trace'){S.screen='trace';S.tr={sel:null,checked:false};render();}
  else if(mode==='sort'){S.screen='sort';setupSortCanvas();render();drawCanvas();}
}
function startCountdown(){let n=3;const b=$('#s1next');if(!b)return;const t=setInterval(()=>{n--;if(!document.body.contains(b)){clearInterval(t);return}if(n<=0){clearInterval(t);b.disabled=false;b.textContent='我看懂了，下一步'}else b.textContent=`我看懂了，下一步（${n}）`},1000)}
function setupStep3(){const q=Q();S.s3={cards:shuffle([...q.nodes.map(n=>({id:n.id,text:n.text,sym:n.symbol})),...q.distractors.map((t,i)=>({id:'d'+i,text:t,sym:'none'}))]).map(c=>({...c,col:null,state:''})),sel:null,allOk:false,hintFor:null}}
function setupDrawCanvas(){const q=Q();newCanvas({});S.cv.tray=shuffle(q.nodes.map(n=>({id:n.id,symbol:n.symbol,text:n.text})))}
function setupSortCanvas(){
  const q=Q(); newCanvas({lockNodes:true});
  const nodes=shuffle(q.nodes.map(n=>({id:n.id,symbol:n.symbol,text:n.text,...nodeSize(n.symbol,n.text)})));
  const cols=3; nodes.forEach((n,i)=>{n.x=80+(i%cols)*300+Math.random()*40;n.y=40+Math.floor(i/cols)*150+Math.random()*30});
  S.cv.nodes=nodes;
}
function nextQuestion(){
  const mode=S.mode; const n=S.qi+1;
  if(n>=BANK.questions.length){toast('全部的題目都做完了，太厲害了！');S.screen='home';render();return}
  startQuestion(mode,n);
}
function bind(){
  const app=$('#app');
  app.onclick=(ev)=>{
    const t=ev.target;
    const go=t.closest('[data-go]'); if(go){leaveCanvas(()=>{S.screen='home';render()});return}
    const act=t.closest('[data-act]'); if(act){handleAct(act.dataset.act);return}
    const mode=t.closest('[data-mode]'); if(mode){S.mode=mode.dataset.mode;store.set('mode',S.mode);render();return}
    const qc=t.closest('[data-q]'); if(qc){saveWho();startQuestion(S.mode,+qc.dataset.q);return}
    const s2=t.closest('[data-s2]'); if(s2){S.s2[s2.dataset.s2]=s2.dataset.v;S.s2.checked=false;render();return}
    const has=t.closest('[data-has]'); if(has){S.s2.has=has.dataset.has==='1';S.s2.which=null;S.s2.checked=false;render();return}
    const wh=t.closest('[data-which]'); if(wh){S.s2.which=wh.dataset.which;S.s2.checked=false;render();return}
    const tr=t.closest('[data-tr]'); if(tr&&!(S.tr.checked&&S.tr.sel===Q().trace.answer)){S.tr.sel=+tr.dataset.tr;S.tr.checked=false;render();return}
    const cv=t.closest('[data-cv]'); if(cv){handleCv(cv.dataset.cv);return}
    // 步驟 3：點卡片／點欄位
    if(S.screen==='draw'&&S.step===3){
      const card=t.closest('[data-card]'); const col=t.closest('[data-col]');
      if(card&&!col){S.s3.sel=S.s3.sel===card.dataset.card?null:card.dataset.card;render();return}
      if(card&&col){ if(S.s3.sel&&S.s3.sel!==card.dataset.card){placeCard(S.s3.sel,col.dataset.col);return} S.s3.sel=S.s3.sel===card.dataset.card?null:card.dataset.card;render();return}
      if(col&&S.s3.sel){placeCard(S.s3.sel,col.dataset.col);return}
    }
  };
  ['w-cls','w-seat','w-name'].forEach(id=>{const el=$('#'+id);if(el)el.onchange=saveWho});
  document.onpointermove=null; document.onpointerup=null; app.onpointerdown=null; drag=null;
  // 步驟 3 拖拉
  if(S.screen==='draw'&&S.step===3) bindStep3Drag();
  // 畫布
  const svg=$('#svg');
  if(svg){
    const cv=$('#cv');
    cv.onpointerdown=cvPointerDown; cv.ondblclick=cvDblClick;
    $('#tray').onpointerdown=cvPointerDown;
    document.onpointermove=cvPointerMove; document.onpointerup=cvPointerUp;
  }
}
function saveWho(){const c=$('#w-cls');if(!c)return;S.who={cls:c.value.trim(),seat:$('#w-seat').value.trim(),name:$('#w-name').value.trim()};store.set('who',S.who)}
function handleAct(a){
  if(a==='help') return showHelp();
  if(a==='symbols') return showSymbols();
  if(a==='settings') return showSettings();
  if(a==='free'){saveWho();S.screen='free';newCanvas({free:true});render();drawCanvas();return}
  if(a==='back'){ if(S.step===4) leaveCanvas(()=>{S.step=3;render()}); else {S.step=Math.max(1,S.step-1);render()} return}
  if(a==='next'){ S.step++; if(S.step===3) setupStep3(); if(S.step===4){setupDrawCanvas();render();drawCanvas();return} render(); return}
  if(a==='check2'){ const s=S.s2; if(s.start==null||s.end==null||s.has==null||(s.has&&!s.which)) return toast('還有一題沒選'); s.checked=true; render(); return}
  if(a==='check3'){ checkStep3(); return}
  if(a==='checktr'){ if(S.tr.sel==null) return toast('先選一個答案'); S.tr.checked=true; const ok=S.tr.sel===Q().trace.answer; S.attempts['trace:'+Q().id]=(S.attempts['trace:'+Q().id]||0)+1; if(ok){S.done['trace:'+Q().id]=true;store.set('done',S.done)} logResult({mode:'trace',qid:Q().id,title:Q().title,result:ok?'過關':'未過',score:ok?'1/1':'0/1',attempt:S.attempts['trace:'+Q().id],hint:ok?'':'選了「'+Q().trace.options[S.tr.sel]+'」'}); render(); return}
  if(a==='nextq'){ nextQuestion(); return}
}
function handleCv(a){
  if(a==='undo') return cvUndo();
  if(a==='clear'){ if(!S.cv.nodes.length&&!S.cv.edges.length) return; cvSnapshot(); hideRes(); S.cv.graded=null; if(!S.cv.free&&!S.cv.lockNodes) S.cv.tray.push(...S.cv.nodes); S.cv.nodes=S.cv.free?[]:S.cv.lockNodes?S.cv.nodes:[]; S.cv.edges=[]; drawCanvas(); return}
  if(a==='png') return downloadPng();
  if(a==='grade') return grade();
  if(a==='fix'){ hideRes(); S.cv.graded=null; drawCanvas(); return}
}
function leaveCanvas(cb){ if(S.cv&&S.cv.nodes.length&&!(S.cv.graded&&S.cv.graded.allOk)){ if(!confirm('離開的話，畫布上的東西會不見，確定嗎？')) return } S.cv=null; closePop(); cb() }

/* 步驟 3 */
function placeCard(id,col){const c=S.s3.cards.find(x=>x.id===id);c.col=col;c.state='';S.s3.sel=null;S.s3.hintFor=null;render()}
function checkStep3(){
  const cards=S.s3.cards; let bad=0;
  cards.forEach(c=>{ if(c.col===c.sym){c.state='ok'} else {c.state='';bad++;c.wrongCol=c.col;c.col=null} });
  if(bad){ const w=cards.find(c=>c.wrongCol&&!c.col); S.s3.hintFor=w?w.wrongCol:null; cards.forEach(c=>c.wrongCol=null); toast(`有 ${bad} 張卡片放錯了，已經退回來，再試一次`); }
  else S.s3.allOk=true;
  render();
}
function bindStep3Drag(){
  let d=null;
  const onDown=(ev)=>{const card=ev.target.closest('[data-card]');if(!card)return;ev.preventDefault();d={id:card.dataset.card,el:card,ghost:null,sx:ev.clientX,sy:ev.clientY,moved:false}};
  document.onpointermove=(ev)=>{ if(!d)return; if(!d.moved){ if(Math.hypot(ev.clientX-d.sx,ev.clientY-d.sy)<6)return; d.moved=true; d.ghost=d.el.cloneNode(true); d.ghost.classList.add('dragghost'); d.ghost.classList.remove('sel'); document.body.appendChild(d.ghost); d.el.classList.add('dragging'); }
    d.ghost.style.left=(ev.clientX-30)+'px'; d.ghost.style.top=(ev.clientY-20)+'px';
    document.querySelectorAll('.col').forEach(c=>c.classList.remove('over')); const el=document.elementFromPoint(ev.clientX,ev.clientY); const col=el&&el.closest('[data-col]'); if(col)col.classList.add('over'); };
  document.onpointerup=(ev)=>{ if(!d)return; if(d.moved){ d.ghost.remove(); const el=document.elementFromPoint(ev.clientX,ev.clientY); const col=el&&el.closest('[data-col]'); const pool=el&&el.closest('#pool'); if(col) placeCard(d.id,col.dataset.col); else if(pool){const c=S.s3.cards.find(x=>x.id===d.id);c.col=null;c.state='';render()} else {d.el.classList.remove('dragging')} } d=null; };
  $('#app').onpointerdown=onDown;
}

/* modal 事件 */
$('#modal').addEventListener('click',ev=>{
  if(ev.target.id==='modal'||ev.target.closest('[data-close]')) return closeModal();
  if(ev.target.closest('[data-savesheet]')){S.sheetUrl=$('#su').value.trim();store.set('sheetUrl',S.sheetUrl);closeModal();toast(S.sheetUrl?'已儲存，之後的作答會送到試算表':'已清除試算表設定');render();flushQueue();return}
  if(ev.target.closest('[data-testsheet]')){const u=$('#su').value.trim();if(!u)return toast('先貼上網址');window.open(u,'_blank');toast('已在新分頁打開，看到「連線正常」就代表成功');return}
  if(ev.target.closest('[data-resetdone]')){S.done={};store.set('done',{});closeModal();toast('已清除');render();return}
});
document.addEventListener('keydown',ev=>{
  if(!S.cv) return; if(ev.target.tagName==='INPUT') return;
  if((ev.key==='Delete'||ev.key==='Backspace')){ const c=S.cv; if(c.selEdge){cvSnapshot();hideRes();c.graded=null;c.edges=c.edges.filter(e=>e.id!==c.selEdge);c.selEdge=null;closePop();drawCanvas()} else if(c.selNode&&!c.lockNodes){const n=c.nodes.find(x=>x.id===c.selNode);cvSnapshot();hideRes();c.graded=null;c.edges=c.edges.filter(e=>e.from!==n.id&&e.to!==n.id);c.nodes=c.nodes.filter(x=>x!==n);if(!c.free)c.tray.push(n);c.selNode=null;drawCanvas()} }
  if((ev.ctrlKey||ev.metaKey)&&ev.key==='z'){ev.preventDefault();cvUndo()}
});
window.addEventListener('beforeunload',ev=>{ if(S.cv&&S.cv.nodes.length&&!(S.cv.graded&&S.cv.graded.allOk)){ev.preventDefault();ev.returnValue=''} });
function checkNarrow(){$('#narrow').classList.toggle('show',window.innerWidth<900)}
window.addEventListener('resize',checkNarrow);
window.addEventListener('hashchange',()=>{if(S.screen==='home')render()});

/* 啟動 */
S.mode=store.get('mode','draw'); if(!MODES[S.mode]) S.mode='draw';
window.addEventListener('DOMContentLoaded',()=>{ render(); checkNarrow(); flushQueue(); });
document.fonts&&document.fonts.ready.then(()=>{ if(S.cv) { S.cv.nodes.forEach(n=>Object.assign(n,nodeSize(n.symbol,n.text))); drawCanvas(); } });
</script>
<script>
/* ===================== 決策樹練習模組 ===================== */
(function(){
const TEACHER = ()=>location.hash==='#teacher';
const B=(key,name,label,t,f)=>({key,name,label,type:'bool',t,f});
const E=(key,name,label,values)=>({key,name,label,type:'enum',values});
const I=(key,name,label,min,max,unit='',crit=[])=>({key,name,label,type:'int',min,max,unit,crit});
const D=(v,br)=>({v,br}); const L=o=>({o});
const C=x=> x===true||x===false ? {op:'is',v:x} : Array.isArray(x)&&typeof x[0]==='string'&&!['<','<=','>','>=','==','!=','between'].includes(x[0]) ? {op:'in',vals:x} : x[0]==='between' ? {op:'between',lo:x[1],hi:x[2]} : {op:x[0],v:x[1]};
const allBool=(keys)=>{const out=[];const n=keys.length;for(let m=0;m<(1<<n);m++){const o={};keys.forEach((k,i)=>o[k]=!!(m&(1<<(n-1-i))));out.push(o)}return out};

const TQ=[
 {id:'t1',title:'今天要帶水壺嗎？',stars:1,kind:'單一二分判斷',level:'skeleton',
  story:'上體育課前，判斷今天是否有體育課。有就帶水壺，沒有就不用特別準備體育課水壺。',
  goal:'從判斷節點拉出兩條線，標上條件，再幫兩個葉節點選好結果。',
  vars:[B('hasPE','體育課','今天有體育課嗎？','有','沒有')],
  outputs:['帶水壺','不需準備體育課水壺'],
  rule:x=>x.hasPE?'帶水壺':'不需準備體育課水壺',
  tests:[{hasPE:true},{hasPE:false}],
  ref:D('hasPE',[[true,L('帶水壺')],[false,L('不需準備體育課水壺')]]),
  hints:['第一個要問的問題是：今天有沒有體育課？','這個問題只有「有」和「沒有」兩種答案，所以要拉出兩條線。','「有」接到「帶水壺」，那「沒有」該接到哪個結果？'],
  focus:'一個判斷、兩條有標籤的分支、兩個輸出。'},
 {id:'t2',title:'猜數字：太大、太小、猜對',stars:1,kind:'三種比較結果',level:'skeleton',
  story:'電腦設定答案 A＝7，你輸入猜測 B。請畫出判斷 B 與 7 大小的決策樹，產生「太小了／猜對了／太大了」。',
  goal:'用條件「< 7」「= 7」「> 7」把三種情況分開。也可以用兩個判斷連續比較。',
  note:'這題只畫「猜一次」的判斷。猜錯要再猜一次，是樹外面的重複流程，不要在樹上畫往回的箭頭。',
  vars:[I('guess','B','你猜的數字 B 是多少？',0,100,'',[7])],
  outputs:['太小了','猜對了','太大了'],
  rule:x=>x.guess<7?'太小了':x.guess===7?'猜對了':'太大了',
  tests:[3,6,7,8,12].map(g=>({guess:g})),
  ref:D('guess',[[['<',7],L('太小了')],[['==',7],L('猜對了')],[['>',7],L('太大了')]]),
  hints:['要問的問題是：B 跟 7 比起來怎麼樣？','比大小會有三種結果：比 7 小、剛好等於 7、比 7 大。','記得檢查 B＝7 的時候會走哪一條路，6 和 8 也試試看。'],
  focus:'三種比較結果互不重疊；B＝7 的邊界要正確。'},
 {id:'t3',title:'運動場的選擇',stars:2,kind:'兩層二分',level:'cards',
  story:'到運動場後，若有人打籃球，詢問能否加入；能加入就打籃球，否則拉單槓。若沒人打籃球，則檢查鞋子是否適合跑步；適合就跑運動場，不適合就開合跳。',
  goal:'把左邊的節點卡片排好、連起來，畫出四種可能結果。',
  vars:[B('players','有人打籃球','有人在打籃球嗎？','有','沒有'),B('canJoin','能加入','可以加入他們嗎？','可以','不可以'),B('shoes','鞋子適合','鞋子適合跑步嗎？','適合','不適合')],
  outputs:['打籃球','拉單槓','跑運動場','開合跳'],
  rule:x=>x.players?(x.canJoin?'打籃球':'拉單槓'):(x.shoes?'跑運動場':'開合跳'),
  tests:[{players:true,canJoin:true,shoes:false},{players:true,canJoin:false,shoes:true},{players:false,canJoin:true,shoes:true},{players:false,canJoin:false,shoes:false}],
  ref:D('players',[[true,D('canJoin',[[true,L('打籃球')],[false,L('拉單槓')]])],[false,D('shoes',[[true,L('跑運動場')],[false,L('開合跳')]])]]),
  hints:['第一個問題：有沒有人在打籃球？','「有人」那邊接著問能不能加入；「沒有人」那邊接著問鞋子適不適合跑步。','每個決策節點都要有兩條線，最下面一共四個結果。'],
  focus:'根節點往下延伸的多重決策；不相關的條件不影響結果。'},
 {id:'t4',title:'出門帶雨傘',stars:2,kind:'多分支、邊界值',level:'cards',
  story:'天氣晴天不帶傘、下雨帶傘、多雲才判斷濕度。多雲且濕度低於 50% 不帶傘；濕度大於或等於 50% 帶傘。',
  goal:'天氣有三種，所以根節點要拉出三條線；多雲那條再接一個濕度的判斷。',
  note:'這是課堂練習用的假設規則，不是真的天氣預報方法。',
  vars:[E('weather','天氣','今天天氣如何？',['晴天','多雲','下雨']),I('humidity','濕度','濕度是多少？',0,100,'%',[50])],
  outputs:['帶傘','不帶傘'],
  rule:x=>x.weather==='晴天'?'不帶傘':x.weather==='下雨'?'帶傘':(x.humidity<50?'不帶傘':'帶傘'),

TQ.forEach(q=>{ if(q.ref){ q.refCount={d:0,l:0}; (function walk(n){ if(n.o){q.refCount.l++;return} q.refCount.d++; n.br.forEach(b=>walk(b[1])) })(q.ref); } });

/* ---------- 狀態 ---------- */
let T=null; // 目前題目的作答狀態
const qById=id=>TQ.find(q=>q.id===id);
const curQ=()=>qById(T.qid);
const varsOf=()=> curQ().level==='design' ? T.design.vars : curQ().vars;
const outsOf=()=> curQ().level==='design' ? T.design.outputs : curQ().outputs;
const varBy=k=>varsOf().find(v=>v.key===k);
function saveT(){ try{ store.set('tree_'+T.qid, {nodes:T.nodes,edges:T.edges,tray:T.tray,seq:T.seq,hints:T.hints,explain:T.explain,design:T.design,refSeen:T.refSeen}); }catch(e){} }

function freshState(q){
  const s={qid:q.id,nodes:[],edges:[],tray:[],seq:1,hints:0,explain:'',design:null,refSeen:false};
  if(q.level==='skeleton'){
    s.nodes.push({id:'n1',kind:'root',var:q.vars[0].key,out:null,x:330,y:40});
    const n=q.refCount.l; for(let i=0;i<n;i++) s.nodes.push({id:'n'+(i+2),kind:'leaf',var:null,out:null,x:90+i*(560/(n-1||1))*1.0,y:260});
    s.seq=n+2;
  } else if(q.level==='cards'){
    let i=1; const cards=[];
    (function walk(n,isRoot){ if(n.o){cards.push({id:'c'+(i++),kind:'leaf',out:n.o});return} cards.push({id:'c'+(i++),kind:isRoot?'root':'decision',var:n.v}); n.br.forEach(b=>walk(b[1],false)) })(q.ref,true);
    s.tray=[cards[0],...shuffle(cards.slice(1))]; s.seq=i+1;
  } else if(q.level==='design'){
    s.design={title:'',desc:'',vars:[
      {key:'v1',name:'天氣',label:'今天天氣如何？',type:'enum',values:['晴天','陰天','下雨'],min:0,max:100,unit:'',t:'是',f:'否'}],
      outputs:['去操場','留在教室'],tests:[]};
  }
  return s;
}
function loadT(q){
  const saved=store.get('tree_'+q.id,null);
  T=Object.assign(freshState(q), saved||{});
  T.qid=q.id; T.undo=[]; T.redo=[]; T.scale=T.scale||1; T.sel=null; T.selEdge=null; T.linkFrom=null; T.hl=null; T.result=null; T.panel=null;
  if(q.level==='design'&&!T.design) T.design=freshState(q).design;
}

/* ---------- 條件 ---------- */
const OPS={'<':'<','<=':'≤','>':'>','>=':'≥','==':'=','!=':'≠'};
function condMatch(v,cond,val){
  if(!cond) return false;
  if(v.type==='bool') return cond.op==='is' && cond.v===val;
  if(v.type==='enum') return cond.op==='in' && cond.vals.includes(val);
  switch(cond.op){case '<':return val<cond.v;case '<=':return val<=cond.v;case '>':return val>cond.v;case '>=':return val>=cond.v;case '==':return val===cond.v;case '!=':return val!==cond.v;case 'between':return val>=cond.lo&&val<=cond.hi}
  return false;
}
function condLabel(v,cond){
  if(!v||!cond) return '？';
  if(v.type==='bool') return cond.v?v.t:v.f;
  if(v.type==='enum') return cond.vals.join('、');
  if(cond.op==='between') return `${cond.lo}～${cond.hi}${v.unit||''}`;
  return `${OPS[cond.op]} ${cond.v}${v.unit||''}`;
}
function valText(v,val){ if(v.type==='bool') return val?v.t:v.f; if(v.type==='int') return val+(v.unit||''); return val; }
function describe(input,vars){ return vars.filter(v=>input[v.key]!==undefined).map(v=>`${v.name}：${valText(v,input[v.key])}`).join('、'); }

/* ---------- 走一遍樹 ---------- */
function route(tree,input,vars){
  const vb=k=>vars.find(v=>v.key===k);
  const roots=tree.nodes.filter(n=>n.kind==='root');
  if(roots.length!==1) return {err:'noroot',path:[],edges:[],steps:[]};
  let n=roots[0]; const path=[n.id], edges=[], steps=[]; const seen=new Set();
  for(let guard=0;guard<60;guard++){
    if(seen.has(n.id)) return {err:'loop',node:n,path,edges,steps};
    seen.add(n.id);
    if(n.kind==='leaf'){ if(!n.out) return {err:'noout',node:n,path,edges,steps}; return {out:n.out,path,edges,steps}; }
    const v=vb(n.var); if(!v) return {err:'novar',node:n,path,edges,steps};
    const val=input[v.key]; const outs=tree.edges.filter(e=>e.from===n.id);
    const m=outs.filter(e=>condMatch(v,e.cond,val));
    if(m.length===0) return {err:'stuck',node:n,v,val,path,edges,steps};
    if(m.length>1) return {err:'overlap',node:n,v,val,matches:m,path,edges,steps};
    steps.push({node:n,v,val,edge:m[0]});
    edges.push(m[0].id); n=tree.nodes.find(x=>x.id===m[0].to); if(!n) return {err:'stuck',path,edges,steps}; path.push(n.id);
  }
  return {err:'loop',path,edges,steps};
}
function domainValues(v,tree,extraTests){
  if(v.type==='bool') return [true,false];
  if(v.type==='enum') return v.values.slice();
  const s=new Set([v.min,v.max]);
  const add=c=>{[c-1,c,c+1].forEach(x=>{if(x>=v.min&&x<=v.max)s.add(x)})};
  (v.crit||[]).forEach(add);
  tree.edges.forEach(e=>{const from=tree.nodes.find(n=>n.id===e.from); if(!from||from.var!==v.key||!e.cond) return; if(e.cond.op==='between'){add(e.cond.lo);add(e.cond.hi)} else if(typeof e.cond.v==='number') add(e.cond.v)});
  (extraTests||[]).forEach(t=>{ if(typeof t[v.key]==='number') add(t[v.key]) });
  return [...s].sort((a,b)=>a-b);
}
function allInputs(vars,tree,tests){
  let rows=[{}];
  vars.forEach(v=>{const vals=domainValues(v,tree,tests);const nr=[];rows.forEach(r=>vals.forEach(x=>nr.push({...r,[v.key]:x})));rows=nr});
  return rows.length>6000?rows.slice(0,6000):rows;
}

/* ---------- 結構檢查 ---------- */
function structIssues(tree,vars){
  const iss=[]; const nm=n=>n.kind==='leaf'?(n.out||'沒選結果的葉節點'):(vars.find(v=>v.key===n.var)||{}).label||'沒選問題的決策節點';
  const roots=tree.nodes.filter(n=>n.kind==='root');
  if(!roots.length) iss.push({msg:'還沒有根節點。先放一個「根節點」，當作第一個要問的問題。',nodes:[]});
  if(roots.length>1) iss.push({msg:'根節點只能有一個。',nodes:roots.map(n=>n.id)});
  tree.nodes.forEach(n=>{
    const inn=tree.edges.filter(e=>e.to===n.id), out=tree.edges.filter(e=>e.from===n.id);
    if(n.kind!=='root'&&inn.length===0) iss.push({msg:`「${nm(n)}」還沒接到樹上，沒有線連進來。`,nodes:[n.id]});
    if(n.kind!=='leaf'&&!n.var) iss.push({msg:'有一個決策節點還沒選「要問什麼問題」。點它一下，選「改問題」。',nodes:[n.id]});
    if(n.kind!=='leaf'&&n.var&&out.length<2) iss.push({msg:`「${nm(n)}」只有 ${out.length} 條分支。判斷至少要有兩條路。`,nodes:[n.id]});
    if(n.kind==='leaf'&&!n.out) iss.push({msg:'有一個葉節點還沒選結果。點它一下，選「改結果」。',nodes:[n.id]});
  });
  return iss;
}

/* ---------- 檢查答案 ---------- */
function grade(){
  const q=curQ(); const vars=varsOf(); const tree={nodes:T.nodes,edges:T.edges};
  const res={issues:[],counter:null,bad:{nodes:new Set(),edges:new Set()},passed:0,total:0,warn:[]};
  const si=structIssues(tree,vars); si.forEach(i=>{res.issues.push(i.msg);i.nodes.forEach(id=>res.bad.nodes.add(id))});
  const isDesign=q.level==='design';
  const tests=isDesign?T.design.tests.map(t=>t.input):q.tests;
  const expect=isDesign?(inp=>{const t=T.design.tests.find(x=>x.input===inp);return t?t.expect:null}):q.rule;
  // 測試案例
  let firstWrong=null;
  tests.forEach(inp=>{ res.total++; const r=route(tree,inp,vars); const exp=expect(inp); if(!r.err&&r.out===exp) res.passed++; else if(!firstWrong) firstWrong={inp,r,exp}; });
  // 窮舉（只有沒有結構問題才做）
  let stuck=null,overlap=null,wrong=null; const used=new Set();
  if(!si.length){
    const inputs=allInputs(vars,tree,tests);
    for(const inp of inputs){
      const r=route(tree,inp,vars); r.edges.forEach(e=>used.add(e));
      if(r.err==='stuck'&&!stuck) stuck={inp,r};
      else if(r.err==='overlap'&&!overlap) overlap={inp,r};
      else if(!r.err&&!isDesign&&r.out!==q.rule(inp)&&!wrong) wrong={inp,r,exp:q.rule(inp)};
    }
    if(stuck){ const v=stuck.r.v; res.issues.push(`「${v.label}」少了一條分支：${v.name}＝${valText(v,stuck.r.val)} 的時候沒有路可以走。`); res.bad.nodes.add(stuck.r.node.id); }
    if(overlap){ const v=overlap.r.v; res.issues.push(`「${v.label}」的條件重疊了：${v.name}＝${valText(v,overlap.r.val)} 同時符合「${overlap.r.matches.map(e=>condLabel(v,e.cond)).join('」和「')}」。`); res.bad.nodes.add(overlap.r.node.id); overlap.r.matches.forEach(e=>res.bad.edges.add(e.id)); }
    T.edges.forEach(e=>{ if(!used.has(e.id)&&!res.bad.edges.has(e.id)){ const f=T.nodes.find(n=>n.id===e.from); const v=f&&varBy(f.var); if(v) res.warn.push(`「${v.label}」的「${condLabel(v,e.cond)}」這條線永遠不會被走到，檢查條件是不是重複或不可能發生。`); } });
  }
  // 反例：先用題目測試，再用窮舉
  const cw = firstWrong && !firstWrong.r.err ? firstWrong : (wrong||null);
  if(cw){ res.counter=`例如「${describe(cw.inp,vars)}」應該是「${cw.exp}」，但你的樹走到「${cw.r.out}」。`; cw.r.edges.forEach(e=>res.bad.edges.add(e)); const last=cw.r.path[cw.r.path.length-1]; if(last) res.bad.nodes.add(last); }
  else if(firstWrong && isDesign){ const r=firstWrong.r; res.counter = r.err ? `你的測試「${describe(firstWrong.inp,vars)}」走不到任何結果。` : `你的測試「${describe(firstWrong.inp,vars)}」期望「${firstWrong.exp}」，但樹走到「${r.out}」。`; }
  if(!isDesign && !cw && !stuck && !overlap && !si.length && res.passed<res.total) res.issues.push('有測試情況走不到結果。');
  res.ok = !isDesign && !res.issues.length && !res.counter && res.passed===res.total;
  if(isDesign) designScore(res,tree,vars,si,stuck,overlap);
  return res;
}
function depthOf(tree){
  const root=tree.nodes.find(n=>n.kind==='root'); if(!root) return 0;
  let best=0; (function walk(id,d,seen){ const n=tree.nodes.find(x=>x.id===id); if(!n||seen.has(id)) return; seen.add(id); if(n.kind!=='leaf'){ best=Math.max(best,d+1); tree.edges.filter(e=>e.from===id).forEach(e=>walk(e.to,d+1,seen)) } })(root.id,0,new Set());
  return best;
}
function designScore(res,tree,vars,si,stuck,overlap){
  const d=T.design; const dec=tree.nodes.filter(n=>n.kind!=='leaf').length, leaves=tree.nodes.filter(n=>n.kind==='leaf').length, depth=depthOf(tree);
  const req=[]; if(dec<3) req.push(`判斷節點至少 3 個（現在 ${dec} 個）`); if(leaves<4) req.push(`葉節點至少 4 個（現在 ${leaves} 個）`); if(depth<2) req.push(`至少 2 層判斷（現在 ${depth} 層）`);
  const nt=d.tests.length, nb=d.tests.filter(t=>t.boundary).length;
  if(nt<5) req.push(`測試至少 5 筆（現在 ${nt} 筆）`); if(nb<1) req.push('至少 1 筆測試要勾「邊界／特殊情況」');
  if(!d.title.trim()) req.push('還沒寫情境標題');
  const sStruct=Math.max(0,30-6*(si.length+req.filter(r=>!r.startsWith('測試')&&!r.startsWith('至少 1 筆')).length));
  const sCond=si.length?0:30-(stuck?15:0)-(overlap?15:0);
  const sTest=nt?Math.round(25*(res.passed/nt)*Math.min(1,nt/5)*(nb?1:0.8)):0;
  const len=d.desc.trim().length; const sDesc=len>=30?15:len>=10?8:0;
  res.design={sStruct,sCond,sTest,sDesc,total:sStruct+sCond+sTest+sDesc,req};
  res.issues=res.issues.concat(req.map(r=>r+'。'));
  if(len<30) res.issues.push('「設計說明」至少寫 30 個字，說明你的情境和為什麼這樣判斷。');
  res.ok = res.design.total>=85 && !req.length && !si.length && !stuck && !overlap && res.passed===nt;
}

/* ---------- 版面 ---------- */
function nodeDims(n){
  const txt=nodeText(n); const w=Math.max(130,Math.min(260,textW(txt)+40)); return {w,h:n.kind==='leaf'?54:62};
}
function nodeText(n){
  if(n.kind==='leaf') return n.out||'（點我選結果）';
  const v=n.var&&varBy(n.var); return v?v.label:'（點我選問題）';
}
const KIND_ZH={root:'根節點',decision:'決策節點',leaf:'葉節點'};
function layoutTree(nodes,edges){
  const root=nodes.find(n=>n.kind==='root'); if(!root) return;
  let slot=0; const placed=new Set(); const X={};
  (function walk(id,d){ const n=nodes.find(x=>x.id===id); if(!n||placed.has(id)) return; placed.add(id);
    const kids=edges.filter(e=>e.from===id).map(e=>e.to);
    n.y=30+d*130;
    if(!kids.length){ X[id]=slot++; } else { kids.forEach(k=>walk(k,d+1)); const xs=kids.filter(k=>X[k]!=null).map(k=>X[k]); X[id]=xs.length?(Math.min(...xs)+Math.max(...xs))/2:slot++; }
  })(root.id,0);
  nodes.forEach(n=>{ if(X[n.id]!=null){ const {w}=nodeDims(n); n.x=40+X[n.id]*200+90-w/2; } });
  let ox=40; const maxY=Math.max(...nodes.filter(n=>placed.has(n.id)).map(n=>n.y));
  nodes.filter(n=>!placed.has(n.id)).forEach(n=>{n.x=ox;n.y=maxY+150;ox+=nodeDims(n).w+30});
}
function treeFromRef(ref){
  const nodes=[],edges=[]; let i=1;
  (function walk(n,isRoot){ const id='r'+(i++); if(n.o){nodes.push({id,kind:'leaf',out:n.o});return id}
    nodes.push({id,kind:isRoot?'root':'decision',var:n.v}); n.br.forEach(([c,child])=>{const cid=walk(child,false);edges.push({id:'e'+(i++),from:id,to:cid,cond:C(c)})}); return id; })(ref,true);
  layoutTree(nodes,edges); return {nodes,edges};
}

/* ---------- SVG ---------- */
function edgeGeom(a,b){
  const da=nodeDims(a), db=nodeDims(b);
  const x1=a.x+da.w/2,y1=a.y+da.h,x2=b.x+db.w/2,y2=b.y;
  const my=(y1+y2)/2; const d=`M${x1} ${y1} C${x1} ${my},${x2} ${my},${x2} ${y2}`;
  return {d,mx:(x1+x2)/2,my,x1,y1,x2,y2};
}
function svgTree(tree,opt={}){
  const hl=opt.hl||{nodes:new Set(),edges:new Set()}, bad=opt.bad||{nodes:new Set(),edges:new Set()}, vb=k=>(opt.vars||varsOf()).find(v=>v.key===k);
  let maxX=600,maxY=360;
  tree.nodes.forEach(n=>{const d=nodeDims(n);maxX=Math.max(maxX,n.x+d.w+60);maxY=Math.max(maxY,n.y+d.h+60)});
  const sc=opt.scale||1;
  const edges=tree.edges.map(e=>{
    const a=tree.nodes.find(n=>n.id===e.from), b=tree.nodes.find(n=>n.id===e.to); if(!a||!b) return '';
    const g=edgeGeom(a,b); const v=vb(a.var); const lab=condLabel(v,e.cond);
    const isH=hl.edges.has(e.id), isB=bad.edges.has(e.id), isS=opt.selEdge===e.id;
    const col=isH?'#E0B35C':isB?'#E07A6B':'#A89E92'; const lw=textW(lab,13)+18;
    return `<g class="te" data-eid="${e.id}" ${opt.interactive?'style="cursor:pointer"':''}>
      ${opt.interactive?`<path d="${g.d}" fill="none" stroke="transparent" stroke-width="16"/>`:''}
      ${isS?`<path d="${g.d}" fill="none" stroke="#C1B2A3" stroke-width="8" opacity=".35"/>`:''}
      <path d="${g.d}" fill="none" stroke="${col}" stroke-width="${isH?4:2}" marker-end="url(#tarr)"/>
      <rect x="${g.mx-lw/2}" y="${g.my-12}" width="${lw}" height="24" rx="12" fill="#262320" stroke="${isH?'#E0B35C':isB?'#E07A6B':'#C49AB8'}" stroke-width="1.5"/>
      <text x="${g.mx}" y="${g.my}" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="700" fill="${isB?'#F0B3A9':'#DCC0D3'}" style="pointer-events:none">${esc(lab)}</text></g>`;
  }).join('');
  const nodes=tree.nodes.map(n=>{
    const {w,h}=nodeDims(n); const isH=hl.nodes.has(n.id), isB=bad.nodes.has(n.id), isS=opt.sel===n.id, isL=opt.linkFrom===n.id;
    const base={root:['#C1B2A3','#2E2A26'],decision:['#C49AB8','#332733'],leaf:['#9DBF9E','#27342A']}[n.kind];
    const stroke=isH?'#E0B35C':isB?'#E07A6B':base[0]; const sw=isH?4:n.kind==='root'?3:2;
    const rx=n.kind==='leaf'?h/2:10; const txt=nodeText(n); const empty=(n.kind==='leaf'&&!n.out)||(n.kind!=='leaf'&&!n.var);
    const v=n.kind!=='leaf'&&n.var&&vb(n.var); const txtS=n.kind==='leaf'?(n.out||'（點我選結果）'):(v?v.label:'（點我選問題）');
    return `<g class="tn" data-nid="${n.id}" ${opt.interactive?`tabindex="0" role="button" aria-label="${KIND_ZH[n.kind]}：${esc(txtS)}" style="cursor:grab"`:''}>
      ${isS||isL?`<rect x="${n.x-6}" y="${n.y-6}" width="${w+12}" height="${h+12}" rx="${rx+6}" fill="none" stroke="${isL?'#8FA9C9':'#C1B2A3'}" stroke-width="2" stroke-dasharray="5 4"/>`:''}
      <rect x="${n.x}" y="${n.y}" width="${w}" height="${h}" rx="${rx}" fill="${isB?'#3A2724':base[1]}" stroke="${stroke}" stroke-width="${sw}"/>
      <text x="${n.x+w/2}" y="${n.y+16}" text-anchor="middle" font-size="11" fill="${base[0]}" style="pointer-events:none">${KIND_ZH[n.kind]}</text>
      <text x="${n.x+w/2}" y="${n.y+h/2+9}" text-anchor="middle" dominant-baseline="central" font-size="14" fill="${empty?'#A89E92':'#F3EEE7'}" style="pointer-events:none">${esc(txtS.length>16?txtS.slice(0,15)+'…':txtS)}</text>
      ${opt.interactive&&n.kind!=='leaf'?`<circle class="tp" cx="${n.x+w/2}" cy="${n.y+h}" r="8" fill="#1C1A17" stroke="#C1B2A3" stroke-width="2" style="cursor:crosshair"/>`:''}
    </g>`;
  }).join('');
  const temp=opt.temp?`<path d="M${opt.temp.x1} ${opt.temp.y1} L${opt.temp.x2} ${opt.temp.y2}" stroke="#8FA9C9" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#tarr)" style="pointer-events:none"/>`:'';
  return `<svg xmlns="http://www.w3.org/2000/svg" ${opt.id?`id="${opt.id}"`:''} width="${maxX*sc}" height="${maxY*sc}" viewBox="0 0 ${maxX} ${maxY}" style="font-family:'LXGW WenKai TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif;display:block;touch-action:none">
    <defs><marker id="tarr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9z" fill="context-stroke"/></marker></defs>
    ${opt.bg?`<rect width="${maxX}" height="${maxY}" fill="#1C1A17"/>`:''}${edges}${nodes}${temp}</svg>`;
}

    <div style="display:flex;gap:6px;flex-wrap:wrap"><button class="sm" data-t="png">匯出 PNG</button><button class="sm" data-t="json">匯出 JSON</button></div>`;
}
function onDesignChange(el){
  const d=T.design; const p=el.dataset.d.split('.'); let val=el.type==='checkbox'?el.checked:el.value;
  if(p[0]==='title'||p[0]==='desc'){ d[p[0]]=val; }
  else if(p[0]==='v'){ const v=d.vars[+p[1]]; const k=p[2];
    if(k==='values') v.values=val.split(/[、,，]/).map(s=>s.trim()).filter(Boolean);
    else if(k==='min'||k==='max') v[k]=parseInt(val)||0;
    else v[k]=val;
    if(k==='type'){ if(!v.values.length) v.values=['選項一','選項二']; T.edges=T.edges.filter(e=>{const f=T.nodes.find(n=>n.id===e.from);return !f||f.var!==v.key}); }
    d.tests.forEach(t=>{ if(v.type==='bool'&&typeof t.input[v.key]!=='boolean') t.input[v.key]=true; if(v.type==='enum'&&!v.values.includes(t.input[v.key])) t.input[v.key]=v.values[0]; if(v.type==='int'&&typeof t.input[v.key]!=='number') t.input[v.key]=v.min; });
  }
  else if(p[0]==='o'){ const old=d.outputs[+p[1]]; d.outputs[+p[1]]=val; T.nodes.forEach(n=>{if(n.out===old)n.out=val}); d.tests.forEach(t=>{if(t.expect===old)t.expect=val}); }
  else if(p[0]==='t'){ const t=d.tests[+p[1]]; const k=p[2];
    if(k==='expect') t.expect=val; else if(k==='boundary') t.boundary=val;
    else { const v=d.vars.find(x=>x.key===k); t.input[k]= v.type==='bool'?val==='true': v.type==='int'?(parseInt(val)||0):val; } }
  saveT(); redrawPanel(); drawTree();
}
function onDesignBtn(a){
  const d=T.design; const [k,i]=a.split('.');
  if(k==='add'){ const key='v'+(Math.max(0,...d.vars.map(v=>+v.key.slice(1)))+1); d.vars.push({key,name:'條件'+(d.vars.length+1),label:'新的問題？',type:'bool',t:'是',f:'否',values:['選項一','選項二'],min:0,max:100,unit:''}); d.tests.forEach(t=>t.input[key]=true); }
  if(k==='del'){ const v=d.vars[+i]; d.vars.splice(+i,1); T.nodes.forEach(n=>{if(n.var===v.key)n.var=null}); T.edges=T.edges.filter(e=>{const f=T.nodes.find(n=>n.id===e.from);return f&&f.var}); d.tests.forEach(t=>delete t.input[v.key]); }
  if(k==='oadd') d.outputs.push('新的結果');
  if(k==='odel'){ const o=d.outputs[+i]; d.outputs.splice(+i,1); T.nodes.forEach(n=>{if(n.out===o)n.out=null}); }
  if(k==='tadd'){ const input={}; d.vars.forEach(v=>input[v.key]=v.type==='bool'?true:v.type==='enum'?v.values[0]:v.min); d.tests.push({input,expect:d.outputs[0]||'',boundary:false}); }
  if(k==='tdel') d.tests.splice(+i,1);
  saveT(); redrawPanel(); drawTree();
}

/* ---------- 繪圖與互動 ---------- */
function drawTree(){
  const wrap=$('#tsvgwrap'); if(!wrap) return;
  const bad=T.result&&!T.result.ok?T.result.bad:null;
  wrap.innerHTML=svgTree({nodes:T.nodes,edges:T.edges},{interactive:true,id:'tsvg',scale:T.scale,hl:T.hl||undefined,bad:bad||undefined,sel:T.sel,selEdge:T.selEdge,linkFrom:T.linkFrom,temp:T.temp});
  const em=$('#tempty'); if(em) em.style.display=T.nodes.length?'none':'';
  const lb=$('#tlinkbar'); if(lb){ if(T.linkFrom){lb.style.display='flex';lb.innerHTML='<span class="msg"><b>連線中</b><span>點要接過去的節點（按 Esc 取消）</span></span><button class="sm" data-t="cancellink">取消</button>'} else lb.style.display='none'; }
  const u=$('[data-t="undo"]'); if(u) u.disabled=!T.undo.length; const r=$('[data-t="redo"]'); if(r) r.disabled=!T.redo.length;
}
function redrawPanel(){ const p=$('#tpanel'); if(p){ const st=p.scrollTop; p.innerHTML=leftPanel(); p.scrollTop=st; bindPanel(); } }
function snap(){ T.undo.push(JSON.stringify({nodes:T.nodes,edges:T.edges,tray:T.tray})); if(T.undo.length>50)T.undo.shift(); T.redo=[]; T.result=null; T.hl=null; hideTRes(); }
function changed(){ saveT(); drawTree(); }
function undo(){ const s=T.undo.pop(); if(!s) return toast('沒有可以復原的了'); T.redo.push(JSON.stringify({nodes:T.nodes,edges:T.edges,tray:T.tray})); Object.assign(T,JSON.parse(s)); T.result=null; closeTPop(); saveT(); redrawPanel(); drawTree(); }
function redo(){ const s=T.redo.pop(); if(!s) return toast('沒有可以重做的了'); T.undo.push(JSON.stringify({nodes:T.nodes,edges:T.edges,tray:T.tray})); Object.assign(T,JSON.parse(s)); closeTPop(); saveT(); redrawPanel(); drawTree(); }
function pt(ev){ const svg=$('#tsvg'); const r=svg.getBoundingClientRect(); const vb=svg.viewBox.baseVal; const k=vb&&vb.width?r.width/vb.width:T.scale; return [(ev.clientX-r.left)/k,(ev.clientY-r.top)/k]; }
function nodeAt(x,y){ return [...T.nodes].reverse().find(n=>{const d=nodeDims(n);return x>=n.x&&x<=n.x+d.w&&y>=n.y&&y<=n.y+d.h}); }
function freeSpot(){ let x=40,y=40; const cv=$('#tcv'); const W=(cv?cv.clientWidth:700)/T.scale-180;
  for(let tries=0;tries<200;tries++){ if(!T.nodes.some(n=>Math.abs(n.x-x)<170&&Math.abs(n.y-y)<90)) return [x,y]; x+=190; if(x>W){x=40;y+=110} } return [40,40]; }

let tdrag=null;
function addFromTray(itemId,x,y){
  const q=curQ(); snap();
  let n;
  if(q.level==='cards'){ const i=T.tray.findIndex(c=>c.id===itemId); const c=T.tray.splice(i,1)[0]; n={id:'n'+(T.seq++),kind:c.kind,var:c.var||null,out:c.out||null,card:c.id}; }
  else { if(itemId==='root'&&T.nodes.some(n=>n.kind==='root')) return toast('根節點只能有一個'); n={id:'n'+(T.seq++),kind:itemId,var:null,out:null}; }
  const d=nodeDims(n); if(x==null){ [x,y]=freeSpot(); } else { x-=d.w/2; y-=d.h/2; }
  n.x=Math.max(0,x); n.y=Math.max(0,y); T.nodes.push(n); saveT(); redrawPanel(); drawTree();
  return n;
}
function onPanelDown(ev){
  const it=ev.target.closest('[data-titem]'); if(!it) return; ev.preventDefault();
  tdrag={type:'tray',item:it.dataset.titem,sx:ev.clientX,sy:ev.clientY,node:null};
}
function onCvDown(ev){
  if(ev.target.closest('.pop')||ev.target.closest('#tlinkbar')||ev.target.closest('.resbar')||ev.target.closest('#ttest')) return;
  const [x,y]=pt(ev);
  const port=ev.target.closest('.tp');
  if(port){ ev.preventDefault(); const nid=port.closest('.tn').dataset.nid; const n=T.nodes.find(z=>z.id===nid); const d=nodeDims(n); tdrag={type:'link',from:nid}; T.temp={x1:n.x+d.w/2,y1:n.y+d.h,x2:x,y2:y}; closeTPop(); drawTree(); return; }
  const gn=ev.target.closest('.tn');
  if(gn){ ev.preventDefault(); const n=T.nodes.find(z=>z.id===gn.dataset.nid);
    if(T.linkFrom){ const f=T.linkFrom; T.linkFrom=null; drawTree(); tryConnect(f,n.id,x,y); return; }
    tdrag={type:'node',id:n.id,dx:x-n.x,dy:y-n.y,moved:false,sx:ev.clientX,sy:ev.clientY}; T.sel=n.id; T.selEdge=null; closeTPop(); drawTree(); return; }
  const ge=ev.target.closest('.te');
  if(ge){ T.selEdge=ge.dataset.eid; T.sel=null; drawTree(); edgeMenu(ge.dataset.eid,x,y); return; }
  T.sel=null; T.selEdge=null; T.linkFrom=null; closeTPop(); drawTree();
}
function onMove(ev){
  if(!tdrag||!T) return;
  if(tdrag.type==='tray'){
    if(!tdrag.node){ const cv=$('#tcv').getBoundingClientRect(); if(ev.clientX>cv.left&&ev.clientX<cv.right&&ev.clientY>cv.top&&ev.clientY<cv.bottom){ const [x,y]=pt(ev); const n=addFromTray(tdrag.item,x,y); if(!n){tdrag=null;return} tdrag={type:'node',id:n.id,dx:nodeDims(n).w/2,dy:nodeDims(n).h/2,moved:true,fromTray:true}; } }
    return;
  }
  ev.preventDefault(); const [x,y]=pt(ev);
  if(tdrag.type==='node'){ const n=T.nodes.find(z=>z.id===tdrag.id); if(!tdrag.moved){ if(Math.hypot(ev.clientX-tdrag.sx,ev.clientY-tdrag.sy)<4) return; snap(); tdrag.moved=true; } n.x=Math.max(0,x-tdrag.dx); n.y=Math.max(0,y-tdrag.dy); drawTree(); }
  if(tdrag.type==='link'){ T.temp.x2=x; T.temp.y2=y; drawTree(); }
}
function onUp(ev){
  if(!tdrag||!T) return; const d=tdrag; tdrag=null;
  if(d.type==='tray'){ const n=addFromTray(d.item); if(n) afterAdd(n); return; }
  if(d.type==='node'){ const n=T.nodes.find(z=>z.id===d.id); if(d.fromTray){ saveT(); afterAdd(n); return; } if(d.moved){ saveT(); return; } nodeMenu(n); return; }
  if(d.type==='link'){ T.temp=null; const el=document.elementFromPoint(ev.clientX,ev.clientY); const g=el&&el.closest('.tn'); const [x,y]=pt(ev);
    if(g&&g.dataset.nid!==d.from) tryConnect(d.from,g.dataset.nid,x,y); else { const n=nodeAt(x,y); if(n&&n.id!==d.from) tryConnect(d.from,n.id,x,y); else drawTree(); } }
}
function afterAdd(n){ if(n.kind!=='leaf'&&!n.var) varMenu(n); else if(n.kind==='leaf'&&!n.out) outMenu(n); }

/* ---------- 連線規則 ---------- */
function isAncestor(a,b){ // a 是 b 的祖先？
  let cur=b; const seen=new Set();
  while(true){ const e=T.edges.find(x=>x.to===cur); if(!e||seen.has(cur)) return false; if(e.from===a) return true; seen.add(cur); cur=e.from; }
}
function tryConnect(from,to,x,y){
  const a=T.nodes.find(n=>n.id===from), b=T.nodes.find(n=>n.id===to); drawTree();
  if(!a||!b||a===b) return;
  if(a.kind==='leaf') return toast('葉節點是最後的結果，下面不能再接東西。');
  if(b.kind==='root') return toast('根節點是最上面的第一個問題，不能有線接進去。');
  if(T.edges.some(e=>e.from===from&&e.to===to)) return toast('這兩個已經接起來了');
  if(T.edges.some(e=>e.to===to)) return toast('每個節點只能有一條線進來。要改的話，先刪掉原本那條線。');
  if(isAncestor(to,from)) return toast('決策樹不能繞回上面。要重複做的事，是樹外面的重複流程。');
  if(!a.var){ toast('先幫這個節點選要問什麼問題'); return varMenu(a); }
  condMenu(a,null,cond=>{ snap(); T.edges.push({id:'e'+(T.seq++),from,to,cond}); changed(); },x,y);
}

function condMenu(node,edge,cb,x,y){
  const v=varBy(node.var); const used=T.edges.filter(e=>e.from===node.id&&e!==edge).map(e=>condLabel(v,e.cond));

      <div class="row" style="align-items:center"><input id="cv1" type="number" min="${v.min}" max="${v.max}" value="${c.op==='between'?c.lo:c.v}" style="width:80px;min-height:34px"><span id="cbt" style="${c.op==='between'?'':'display:none'}">～ <input id="cv2" type="number" min="${v.min}" max="${v.max}" value="${c.op==='between'?c.hi:v.max}" style="width:80px;min-height:34px"></span><span class="small">${esc(v.unit||'')}</span></div>

/* ---------- 測試你的樹 ---------- */
let animT=null;
function testPanel(){
  closeTPop(); const old=$('#ttest'); if(old){ old.remove(); return; }
  const vars=varsOf(); if(!vars.length) return toast('先新增變數');
  const q=curQ(); const cv=$('#tcv'); const p=document.createElement('div'); p.className='resbar'; p.id='ttest';
  p.style.flexDirection='column'; p.style.alignItems='stretch'; p.style.maxHeight='46%'; p.style.overflow='auto';
  const field=v=> v.type==='bool'?`<select id="ti_${v.key}" style="min-height:34px"><option value="true">${esc(v.t)}</option><option value="false">${esc(v.f)}</option></select>`

    : `<input id="ti_${v.key}" type="number" min="${v.min}" max="${v.max}" value="${v.crit&&v.crit[0]!=null?v.crit[0]:v.min}" style="width:90px;min-height:34px">`;
  const demo = TEACHER()&&q.tests&&q.tests.length ? `<div style="display:flex;gap:6px;flex-wrap:wrap;align-items:center"><span class="small" style="color:var(--warning)">老師示範輸入：</span>${q.tests.map((t,i)=>`<button class="sm" data-demo="${i}">${esc(describe(t,vars))}</button>`).join('')}</div>`:'';
  p.innerHTML=`<div style="display:flex;justify-content:space-between;align-items:center"><b>測試你的樹：選一種情況，看它會走到哪裡</b><button class="sm" data-tt="close">關閉</button></div>${demo}
    <div style="display:flex;gap:14px;flex-wrap:wrap;align-items:center">${vars.map(v=>`<label class="small" style="display:flex;gap:6px;align-items:center">${esc(v.name)} ${field(v)}</label>`).join('')}<button class="primary sm" data-tt="run">執行</button></div>
    <div id="tlog" class="small" style="line-height:1.8;color:var(--text-2)"></div>`;
  p.addEventListener('pointerdown',e=>e.stopPropagation());
